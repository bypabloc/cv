# @i18n hub-selector.es
# Textos exclusivos del selector multi-niche de la app hub (espanol).
# Validado por HubSelectorStringsSchema. Su par es hub-selector.en.yaml.

heroEyebrow: "Pablo Contreras · Lima, Perú · Remoto LATAM/US"

# Mega-headline partido en 3 segmentos visuales (lead con gradiente,
# tail atenuado). El render los concatena con saltos de linea.
heroHeadline:
  lead: "Cinco"
  mid: "enfoques."
  tail: "Elige el que conecta."

heroIntro: "Elige por dónde entrar a mi perfil: fintech, arquitectura, liderazgo, vibe coding o full stack. Cinco vistas, una sola historia — o recórrela en 3D como un juego."

cardCta: "Entrar"
otherLocaleLink: "English version →"

# Las 6 cards del selector, en orden de render. El accent y la URL se
# resuelven en codigo (SITE_URLS + tokens del DS) — aqui solo el texto.
# `journey` no es un niche del CV: es el sitio del CV como viaje 3D.
cards:
  - niche: generic
    title: "Full Stack Senior"
    blurb: "Vue + Django + AWS · 8 años · todas las skills"
  - niche: fintech
    title: "Fintech LATAM"
    blurb: "Chile, México · saldar deudas · scoring · créditos"
  - niche: architect
    title: "Architect"
    blurb: "Microservicios · microfrontend · sistemas escalables"
  - niche: leader
    title: "Tech Lead"
    blurb: "Liderazgo de equipos · mentoring · entregar producto"
  - niche: vibe
    title: "Vibe Coding"
    blurb: "Claude Code · Cursor · dev tools · workflows IA"
  - niche: journey
    title: "CV Interactivo 3D"
    blurb: "Recorre mi carrera como un juego · walking-sim · three.js"
