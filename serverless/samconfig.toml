version = 0.1

# ============================================================================
# SAM CLI config por stage (dev, prod)
# ============================================================================
# Uso: `sam deploy --config-env=dev` o `sam deploy --config-env=prod`
# Devtools wrapper: `python devtools/run.py serverless deploy --env=dev`
# ============================================================================

[default.global.parameters]
stack_name = "portfolio-backend-dev"

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
fail_on_empty_changeset = false
region = "us-east-1"

# ---- Stage: dev -----------------------------------------------------------
[dev.global.parameters]
stack_name = "portfolio-backend-dev"

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "portfolio-backend-dev"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
region = "us-east-1"
fail_on_empty_changeset = false
parameter_overrides = "Stage=dev LogLevel=INFO"
tags = "Project=portfolio Stage=dev ManagedBy=SAM"

[dev.sync.parameters]
stack_name = "portfolio-backend-dev"
resolve_s3 = true
region = "us-east-1"
parameter_overrides = "Stage=dev LogLevel=DEBUG"
watch = true

# ---- Stage: prod ----------------------------------------------------------
[prod.global.parameters]
stack_name = "portfolio-backend-prod"

[prod.build.parameters]
cached = true
parallel = true

[prod.deploy.parameters]
stack_name = "portfolio-backend-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "us-east-1"
fail_on_empty_changeset = false
parameter_overrides = "Stage=prod LogLevel=WARNING"
tags = "Project=portfolio Stage=prod ManagedBy=SAM"
