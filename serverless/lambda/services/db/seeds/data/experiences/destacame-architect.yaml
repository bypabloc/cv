    - >-
      Desarrollé un administrador de campañas que automatizó un proceso manual, reduciendo su
      tiempo de ejecución de horas a minutos.
    - >-
      Incorporé herramientas de desarrollo asistido por IA al flujo del equipo, acortando los
      tiempos de implementación de tareas repetitivas.
    - >-
      Sostengo desde hace más de tres años un rol técnico de creciente responsabilidad, hoy en el
      equipo de plataforma.
  en:
    - >-
      Defined the product's microfrontends architecture, enabling several teams to work in
      parallel with lower coupling between their applications.
    - >-
      Technically led teams of four to six people, sustaining solution delivery through
      reorganizations and staff reductions.
    - >-
      Made significant contributions to fintech products in real use, gaining deep domain
      knowledge of the debt and credit markets in Chile and Mexico.
    - >-
      Built a campaign manager that automated a manual process, cutting its execution time from
      hours to minutes.
    - >-
      Brought AI-assisted development tools into the team's workflow, shortening implementation
      time for repetitive tasks.
    - >-
      Have held a technical role of growing responsibility for over three years, currently on the
      platform team.
