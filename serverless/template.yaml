AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# ============================================================================
# Portfolio backend serverless (form contacto + tracking pixel + analytics)
# Region: us-east-1 | Runtime: Python 3.13 | Architecture: arm64 Graviton2
# ============================================================================
# SPEC-001: SAM template base con 3 tablas DynamoDB hot path, Layer Powertools
# y API Gateway REST. Lambdas se agregan en SPECs 005/006/007/009/010/014.
# ============================================================================

Description: >
  Portfolio backend serverless: 3 tablas DynamoDB hot path (contacts, tracking,
  cache), 1 Lambda Layer compartido (Powertools v3 + httpx + pydantic) y
  1 API Gateway REST con CORS multi-subdomain.
  SPEC-001 - serverless/specs/SPEC-001-sam-template-base.md

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Ambiente del stack (dev | prod). Define naming + log level.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Powertools log level (default INFO; prod recomendado WARNING).
  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: 'https://the-full-stack.com,https://hub.the-full-stack.com,https://fintech.the-full-stack.com,https://architect.the-full-stack.com,https://leader.the-full-stack.com,https://vibe.the-full-stack.com'
    Description: >
      Whitelist de origins para CORS. La Lambda valida el Origin header y
      hace echo del valor matcheado en Access-Control-Allow-Origin (no usar
      '*' por compatibilidad con credentials: include en futuro).

# ============================================================================
# Globals: configuracion compartida por TODAS las Lambdas del stack
# ============================================================================
# Decision (ADR-001): Python 3.13 oficial desde Nov 2024, LTS hasta Oct 2029
# Decision (ADR-006): arm64 Graviton2 da -20% costo + +19% perf vs x86_64
# Tracing: Active habilita X-Ray para todo el stack (free tier 100k traces/mes)
# LogRetentionInDays: 7 cabe en 5 GB/mes free tier de CloudWatch Logs
# ============================================================================
Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        # Powertools v3 envs (logger / tracer / metrics)
        POWERTOOLS_SERVICE_NAME: portfolio-backend
        POWERTOOLS_METRICS_NAMESPACE: Portfolio
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        LOG_LEVEL: !Ref LogLevel
        # Nombres de tablas (las Lambdas las leen via os.environ)
        CONTACTS_TABLE_NAME: !Ref ContactsTable
        TRACKING_TABLE_NAME: !Ref TrackingTable
        CACHE_TABLE_NAME: !Ref CacheTable
        RATE_LIMIT_RULES_TABLE_NAME: !Ref RateLimitRulesTable
        RATE_LIMIT_BUCKETS_TABLE_NAME: !Ref RateLimitBucketsTable
        # SSM paths (las Lambdas resuelven valores con boto3 SSM client)
        SSM_TURNSTILE_SECRET_PATH: /portfolio/turnstile-secret
        SSM_NEON_URL_PATH: /portfolio/neon-url
        SSM_OWNER_EMAIL_PATH: /portfolio/owner-email
        SSM_SES_FROM_PATH: /portfolio/ses-from-address
        # KMS key alias para decryption de SSM SecureStrings
        KMS_KEY_ALIAS: alias/portfolio-lambdas
        # Stage marker para conditional behavior (ej: skip Turnstile en test)
        STAGE: !Ref Stage
    Tags:
      Project: portfolio
      ManagedBy: SAM
      Stage: !Ref Stage

  # NOTA: Globals.Api se agrega en SPEC-005 con la primera Function que tenga
  # Events: Api. CloudFormation no acepta crear un AWS::Serverless::Api sin
  # metodos (HandlerErrorCode: InvalidRequest "REST API doesn't contain any
  # methods"). El API se materializa cuando aparece el primer endpoint.

Resources:
  # ==========================================================================
  # Lambda Layer compartido: Powertools v3 + httpx + pydantic
  # ==========================================================================
  # Decision: 1 layer para todas las Lambdas, separado de psycopg3 layer
  # (este queda para SPEC-008 con compilacion arm64 cross-platform).
  # Layer en lugar de requirements.txt por Lambda reduce cold start ~80ms.
  # ==========================================================================
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub portfolio-common-${Stage}
      Description: Powertools v3 + httpx + pydantic v2 compartido entre Lambdas
      ContentUri: layers/common_python/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64

  # Layer separado para psycopg3 (Lambdas que tocan Neon: SPEC-009/010)
  PostgresLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub portfolio-postgres-${Stage}
      Description: psycopg3 binary arm64 para Lambdas que tocan Neon PostgreSQL
      ContentUri: layers/postgres_python/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - arm64
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64

  # ==========================================================================
  # API Gateway REST + CloudWatch Access Log Group
  # ==========================================================================
  # IAM role para que API Gateway pueda escribir CloudWatch Logs
  # (account-level setting, requerido para AccessLogSetting funcione)
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub portfolio-api-cwlogs-role-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  PortfolioApi:
    Type: AWS::Serverless::Api
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub portfolio-api-${Stage}
      StageName: !Ref Stage
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime","method":"$context.httpMethod",
          "path":"$context.path","status":"$context.status",
          "responseLength":"$context.responseLength",
          "integrationLatency":"$context.integrationLatency",
          "latency":"$context.responseLatency"}
      Cors:
        AllowOrigin: "'https://the-full-stack.com'"
        AllowHeaders: "'Content-Type,X-Turnstile-Token,X-Turnstile-Bypass-Secret'"
        AllowMethods: "'GET,POST,OPTIONS'"
        MaxAge: "'600'"
        AllowCredentials: false
      Tags:
        Project: portfolio
        ManagedBy: SAM
        Stage: !Ref Stage

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/portfolio-api-${Stage}
      RetentionInDays: 7

  # ==========================================================================
  # Lambda: contact_form (POST /contact, SPEC-005)
  # ==========================================================================
  ContactFormFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64
    Properties:
      FunctionName: !Sub portfolio-contact-form-${Stage}
      CodeUri: src/
      Handler: contact_form.handler.lambda_handler
      Layers:
        - !Ref CommonLayer
      MemorySize: 512
      Timeout: 30
      # NOTA: ReservedConcurrentExecutions removido - la cuenta tiene
      # UnreservedConcurrentExecution limit bajo (10) por ser nueva, lo que
      # impide reservar. Se puede pedir limit increase a AWS support si se
      # necesita en el futuro.
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: contact-form
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ContactsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitRulesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitBucketsTable
        - SSMParameterReadPolicy:
            ParameterName: 'portfolio/turnstile-secret'
        - SSMParameterReadPolicy:
            ParameterName: 'portfolio/owner-email'
        - SSMParameterReadPolicy:
            ParameterName: 'portfolio/ses-from-address'
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource:
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/the-full-stack.com
                - !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/no-reply@the-full-stack.com
      Events:
        PostContact:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /contact
            Method: POST
      Tags:
        Project: portfolio
        ManagedBy: SAM
        Stage: !Ref Stage

  # ==========================================================================
  # Lambda: turnstile_validator (POST /validate-turnstile, SPEC-007)
  # ==========================================================================
  TurnstileValidatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64
    Properties:
      FunctionName: !Sub portfolio-turnstile-validator-${Stage}
      CodeUri: src/
      Handler: turnstile_validator.handler.lambda_handler
      Layers:
        - !Ref CommonLayer
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: turnstile-validator
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitRulesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitBucketsTable
        - SSMParameterReadPolicy:
            ParameterName: 'portfolio/turnstile-secret'
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        PostValidateTurnstile:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /validate-turnstile
            Method: POST
      Tags:
        Project: portfolio
        ManagedBy: SAM
        Stage: !Ref Stage

  # ==========================================================================
  # Lambda: tracking_pixel (POST /track, SPEC-006)
  # ==========================================================================
  TrackingPixelFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64
    Properties:
      FunctionName: !Sub portfolio-tracking-pixel-${Stage}
      CodeUri: src/
      Handler: tracking_pixel.handler.lambda_handler
      Layers:
        - !Ref CommonLayer
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: tracking-pixel
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackingTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitRulesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitBucketsTable
      Events:
        PostTrack:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /track
            Method: POST
      Tags:
        Project: portfolio
        ManagedBy: SAM
        Stage: !Ref Stage

  # ==========================================================================
  # Lambda: aggregator (cron 03:00 UTC daily, SPEC-010)
  # ==========================================================================
  AggregatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64
    Properties:
      FunctionName: !Sub portfolio-aggregator-${Stage}
      CodeUri: src/
      Handler: aggregator.handler.lambda_handler
      Layers:
        - !Ref CommonLayer
        - !Ref PostgresLayer
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: aggregator
          SSM_NEON_URL_PATH: /portfolio/neon-url
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: 'portfolio/neon-url'
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Events:
        Daily03UTC:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 3 * * ? *)'
            Description: 'Aggregator nightly daily_metrics + MV refresh'
            Enabled: true
      Tags:
        Project: portfolio
        ManagedBy: SAM
        Stage: !Ref Stage

  # ==========================================================================
  # Lambda: stream_processor (DynamoDB Streams -> Neon, SPEC-009)
  # ==========================================================================
  StreamProcessorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub portfolio-stream-processor-dlq-${Stage}
      MessageRetentionPeriod: 1209600  # 14 dias
      VisibilityTimeout: 300

  StreamProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.13
      BuildArchitecture: arm64
    Properties:
      FunctionName: !Sub portfolio-stream-processor-${Stage}
      CodeUri: src/
      Handler: stream_processor.handler.lambda_handler
      Layers:
        - !Ref CommonLayer
        - !Ref PostgresLayer
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: stream-processor
          SSM_NEON_URL_PATH: /portfolio/neon-url
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt StreamProcessorDLQ.Arn
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt StreamProcessorDLQ.QueueName
        - SSMParameterReadPolicy:
            ParameterName: 'portfolio/neon-url'
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource:
                - !GetAtt ContactsTable.StreamArn
                - !GetAtt TrackingTable.StreamArn
      Events:
        ContactsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ContactsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StreamProcessorDLQ.Arn
        TrackingStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt TrackingTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StreamProcessorDLQ.Arn
      Tags:
        Project: portfolio
        ManagedBy: SAM
        Stage: !Ref Stage

  # ==========================================================================
  # DynamoDB: ContactsTable - form de contacto
  # ==========================================================================
  # PK: id (UUIDv7 hex) - sorted by time naturally (ADR-004)
  # Streams: NEW_AND_OLD_IMAGES para SPEC-009 stream_processor -> Neon PG
  # PITR: enabled para recovery <35d
  # Capacity: On-Demand (free tier 25 WCU + 25 RCU + 25 GB perpetuo)
  # ==========================================================================
  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-contacts-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: TrackingTable - eventos de tracking pixel
  # ==========================================================================
  # PK + SK composite: (session_id, page_id) permite query "session journey"
  # TTL: expires_at (Unix epoch) - AWS borra automaticamente sin WCU cost
  # Retention 60d via expires_at = now + 60 dias en cada PutItem
  # Streams: NEW_AND_OLD_IMAGES (REMOVE events vienen de TTL expirations)
  # ==========================================================================
  TrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-tracking-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: page_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: page_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: CacheTable - cache key-value (SPEC-003)
  # ==========================================================================
  # PK: cache_key (string)
  # TTL: expires_at (Unix epoch) - AWS borra hasta 48h despues sin WCU cost
  # NO Streams - los eventos de cache no son interesantes para replicar
  # Patron documentado en .claude/docs/dynamodb-cache/
  # ==========================================================================
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-cache-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # NO PITR para cache (datos ephemeral por diseno)
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: RateLimitRulesTable - rules per-endpoint/IP/country (SPEC-004)
  # ==========================================================================
  # PK: rule_key (string), SK: kind (string)
  # rule_key examples: 'endpoint#/contact', 'ip#1.2.3.4', 'country#CN'
  # kind: 'endpoint' | 'ip_whitelist' | 'ip_blacklist' | 'country'
  # TTL: expires_at (para auto-blacklist con 24h expiry)
  # ==========================================================================
  RateLimitRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-rate-limit-rules-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rule_key
          AttributeType: S
        - AttributeName: kind
          AttributeType: S
      KeySchema:
        - AttributeName: rule_key
          KeyType: HASH
        - AttributeName: kind
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: RateLimitBucketsTable - sliding window counters (SPEC-004)
  # ==========================================================================
  # PK: bucket_key (string)
  # bucket_key format: 'ip#<IP>#endpoint#<PATH>#window#<TIMESTAMP>'
  # Atomic ADD :inc para count + turnstile_tokens
  # TTL: window_start + window_seconds * 2 (mantener previous window)
  # ==========================================================================
  RateLimitBucketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-rate-limit-buckets-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bucket_key
          AttributeType: S
      KeySchema:
        - AttributeName: bucket_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

# ============================================================================
# Outputs: usados por devtools y otros stacks dependientes
# ============================================================================
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${PortfolioApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub portfolio-backend-${Stage}-ApiEndpoint
  ApiId:
    Description: API Gateway REST ID
    Value: !Ref PortfolioApi
    Export:
      Name: !Sub portfolio-backend-${Stage}-ApiId
  ContactFormFunctionArn:
    Description: ARN del Lambda contact_form
    Value: !GetAtt ContactFormFunction.Arn
    Export:
      Name: !Sub portfolio-backend-${Stage}-ContactFormFunctionArn
  TrackingPixelFunctionArn:
    Description: ARN del Lambda tracking_pixel
    Value: !GetAtt TrackingPixelFunction.Arn
    Export:
      Name: !Sub portfolio-backend-${Stage}-TrackingPixelFunctionArn
  ContactsTableName:
    Description: Tabla DynamoDB de contacts (form submissions)
    Value: !Ref ContactsTable
    Export:
      Name: !Sub portfolio-backend-${Stage}-ContactsTable
  ContactsTableArn:
    Description: ARN de ContactsTable para IAM policies de Lambdas
    Value: !GetAtt ContactsTable.Arn
    Export:
      Name: !Sub portfolio-backend-${Stage}-ContactsTableArn
  ContactsStreamArn:
    Description: Stream ARN de ContactsTable para SPEC-009 stream_processor
    Value: !GetAtt ContactsTable.StreamArn
    Export:
      Name: !Sub portfolio-backend-${Stage}-ContactsStreamArn
  TrackingTableName:
    Description: Tabla DynamoDB de tracking pixel (TTL 60d)
    Value: !Ref TrackingTable
    Export:
      Name: !Sub portfolio-backend-${Stage}-TrackingTable
  TrackingTableArn:
    Value: !GetAtt TrackingTable.Arn
    Export:
      Name: !Sub portfolio-backend-${Stage}-TrackingTableArn
  TrackingStreamArn:
    Value: !GetAtt TrackingTable.StreamArn
    Export:
      Name: !Sub portfolio-backend-${Stage}-TrackingStreamArn
  CacheTableName:
    Description: Tabla DynamoDB de cache key-value
    Value: !Ref CacheTable
    Export:
      Name: !Sub portfolio-backend-${Stage}-CacheTable
  CacheTableArn:
    Value: !GetAtt CacheTable.Arn
    Export:
      Name: !Sub portfolio-backend-${Stage}-CacheTableArn
  CommonLayerArn:
    Description: ARN del CommonLayer para reusar en otros stacks
    Value: !Ref CommonLayer
    Export:
      Name: !Sub portfolio-backend-${Stage}-CommonLayerArn
  RateLimitRulesTableName:
    Description: Tabla DynamoDB de rate-limit rules (per-IP/endpoint/country)
    Value: !Ref RateLimitRulesTable
    Export:
      Name: !Sub portfolio-backend-${Stage}-RateLimitRulesTable
  RateLimitRulesTableArn:
    Value: !GetAtt RateLimitRulesTable.Arn
    Export:
      Name: !Sub portfolio-backend-${Stage}-RateLimitRulesTableArn
  RateLimitBucketsTableName:
    Description: Tabla DynamoDB de rate-limit sliding window counters
    Value: !Ref RateLimitBucketsTable
    Export:
      Name: !Sub portfolio-backend-${Stage}-RateLimitBucketsTable
  RateLimitBucketsTableArn:
    Value: !GetAtt RateLimitBucketsTable.Arn
    Export:
      Name: !Sub portfolio-backend-${Stage}-RateLimitBucketsTableArn
