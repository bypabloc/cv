[pytest]
# Correr desde la raiz del lambda: pytest tests/unit  o  pytest tests/integration
# rootdir = raiz del lambda, para que 'from tests.unit._helpers import ...'
# y 'from tests.integration._fixtures... import ...' resuelvan.
testpaths = tests
python_files = test_*.py
python_functions = test_*
# Marca cada nivel; correr unit e integration por separado:
#   pytest tests/unit
#   pytest tests/integration
addopts = -ra
