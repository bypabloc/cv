slug: destacame-debt-chile
name: Sistema de saldar deudas (Chile)
summary:
  es: >-
    Plataforma fintech B2C que ayuda a usuarios chilenos a negociar y saldar deudas con
    instituciones financieras.
  en: >-
    Fintech B2C platform that helps Chilean users negotiate and settle debts with financial
    institutions.
description:
  es: >-
    Producto desarrollado en Destacame como Arquitecto Frontend. Integra microservicios Django +
    frontend Vue/Nuxt y maneja flujos sensibles de PII y compliance financiero.
  en: >-
    Product built at Destacame as Frontend Architect. Integrates Django microservices with a
    Vue/Nuxt frontend and handles sensitive PII flows and financial compliance.
status: active
niches:
  - fintech
  - architect
  - generic
priority:
  fintech: 100
  architect: 90
  generic: 70
stack:
  - Vue
  - Nuxt
  - TypeScript
  - Django
  - Python
  - AWS
  - Microservicios
caseStudy:
  es: >-
    Problema: los usuarios chilenos no tenían un canal claro para regularizar deudas y las
    instituciones perdían cobranzas. Solución: orquestación entre microservicios fintech con un
    flujo guiado de elegibilidad → oferta → pago. Impacto: mejora medible en la eficiencia operativa
    de cobranza y en la experiencia del usuario final (detalles bajo NDA).
  en: >-
    Problem: Chilean users lacked a clear channel to regularize debts and institutions lost
    collections. Solution: orchestration across fintech microservices with a guided eligibility →
    offer → payment flow. Impact: measurable improvement in collection operational efficiency and
    end-user experience (details under NDA).
metrics:
  market: Chile
  compliance: PCI DSS aware · KYC · PII handling
  architecture: Vue/Nuxt + Django microservices + AWS
caseStudyDetailed:
  problem:
    es: >-
      Los usuarios chilenos no tenian un canal claro para regularizar deudas y las instituciones
      financieras perdian cobranzas significativas. Datos sensibles (PII) + compliance financiero
      LATAM.
    en: >-
      Chilean users lacked a clear channel to regularize debts and financial institutions were
      losing significant collections. Sensitive data (PII) + LATAM financial compliance.
  process:
    es: >-
      Como Frontend Architect orqueste microservicios Django con frontend Vue/Nuxt: elegibilidad →
      oferta → pago. Manejo de PII con encriptacion en transito y reposo. Integracion con bureaus +
      verificacion KYC.
    en: >-
      As Frontend Architect I orchestrated Django microservices with Vue/Nuxt frontend: eligibility
      → offer → payment. PII handling with encryption in transit and at rest. Bureau integrations +
      KYC verification.
  result:
    es: >-
      Mejora medible en eficiencia operativa de cobranza y experiencia del usuario final. Plataforma
      sigue en produccion sirviendo el mercado chileno (metricas detalladas bajo NDA).
    en: >-
      Measurable improvement in collection operational efficiency and end-user experience. Platform
      still in production serving the Chilean market (detailed metrics under NDA).
isConfidential: true
