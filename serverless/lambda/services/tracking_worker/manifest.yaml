# Manifiesto del Lambda `tracking_worker` — fuente de verdad de su config.
#
# Worker async (spec lambdas-async-sqs): consume la cola SQS
# `portfolio-tracking-events-${stage}` con batch_size=10 y persiste cada
# evento en Neon (`tracking_events`) usando UNA sola conexion compartida
# entre los 10 mensajes del batch (cold-start de Neon amortizado).
#
# devtools traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=tracking_worker

# --- Identidad ---
name: tracking-worker
description: Procesa batches SQS de tracking events (Neon, batch=10).

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 256       # MB — un batch de 10 events es liviano.
timeout: 10       # segundos — visibility_timeout=60 = 6x (margen).

# --- Como se invoca este Lambda ---
# sqs: el Event Source Mapping reparte mensajes de la cola al Lambda en
# batches. `ReportBatchItemFailures` permite devolver solo los message_id
# fallidos: SQS borra los exitosos y reintenta unicamente los devueltos.
trigger:
  type: sqs
  queue: portfolio-tracking-events-${stage}
  batch_size: 10
  function_response_types:
    - ReportBatchItemFailures

# --- Que recursos del backend usa ---
uses:
  # Cola SQS consumida (consumer = ReceiveMessage + DeleteMessage +
  # GetQueueAttributes). El Lambda NO publica; solo consume.
  queues:
    - name: portfolio-tracking-events-${stage}
      access: consumer
  # Tabla DynamoDB usada por el `@cached` del parsing de User-Agent
  # (mismo namespace `ua` que el tracking_pixel original — cache
  # compartido para warm hits inter-Lambda).
  tables:
    cache: read-write
  # neon-url: connection string del Neon ${stage} (escritura directa
  # idempotente con ON CONFLICT del INSERT en tracking_events).
  secrets:
    - neon-url
  sends-email: false

# --- Variables de entorno por stage ---
env:
  default:
    LOG_LEVEL: INFO
  dev:
    LOG_LEVEL: INFO
  stage:
    LOG_LEVEL: INFO
  prod:
    LOG_LEVEL: WARNING
