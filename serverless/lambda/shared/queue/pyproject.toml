# @config: shared/queue/pyproject.toml
# @description: manifiesto del subpaquete shared.queue (publisher SQS
#   compartido por los encoders contact_form + tracking_pixel). NO es
#   un paquete publicable.

[project]
name = "shared-queue"
version = "0"
description = "Publisher SQS para los encoders del backend."
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.34.0,<2.0",
  "aws-lambda-powertools[all]>=3.0.0,<4.0",
]

[tool.shared]
# Convencion shared_resolver: nombres SIN prefijo `shared.` (el resolver
# scopa contra serverless/lambda/shared/<name>). Ver shared/db,
# shared/cache, shared/rate_limit como referencia.
internal-deps = ["observability", "aws"]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "moto[sqs,ssm]>=5.0,<6.0",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [".venv/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = ["E501", "ANN401", "S101", "S311"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
