# Portfolio - test compose (build + preview, sin HMR, puerto 9972).

x-app-environment: &app-environment
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  BASE_SCHEME: ${BASE_SCHEME:-http}
  BASE_PORT: ${BASE_PORT:-9972}

services:
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx-test
    ports:
      - "${PROXY_PORT:-9972}:80"
    volumes:
      - ../nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/error-pages:/usr/share/nginx/error-pages:ro
      - ../nginx/services-page:/usr/share/nginx/services-page:ro
    depends_on:
      generic:
        condition: service_started
      hub:
        condition: service_started
      fintech:
        condition: service_started
      architect:
        condition: service_started
      leader:
        condition: service_started
      vibe:
        condition: service_started
    restart: unless-stopped

  generic:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/generic/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-generic-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  hub:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/hub/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-hub-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  fintech:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/fintech/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-fintech-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  architect:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/architect/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-architect-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  leader:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/leader/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-leader-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  vibe:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/vibe/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-vibe-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  # Feature tests shared (Playwright). On-demand via `profile: [feature]`.
  feature:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/feature/Dockerfile
    container_name: portfolio-feature-test
    network_mode: host
    volumes:
      - ../..:/app
      - feature_node_modules:/app/tests/feature/node_modules
    depends_on:
      nginx:
        condition: service_started
    profiles:
      - feature
    restart: "no"

volumes:
  portfolio_node_modules:
  feature_node_modules:
