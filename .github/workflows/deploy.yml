name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: 'App to deploy (or "all")'
        required: false
        default: 'all'
        type: choice
        options: [all, hub, generic, fintech, architect, leader, vibe]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.23.0'

jobs:
  detect-changes:
    name: Detect which apps changed
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        name: Detect changed apps
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.app }}"
          ALL='["hub","generic","fintech","architect","leader","vibe"]'

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$INPUT" != "all" ] && [ -n "$INPUT" ]; then
            echo "apps=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Path filtering: if any shared package or root config changed, rebuild all
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          if echo "$CHANGED" | grep -qE '^(packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|biome\.json|tsconfig)'; then
            echo "Shared change detected → all apps"
            echo "apps=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise: only apps with changes
          APPS=$(echo "$CHANGED" | grep -oE '^apps/[^/]+' | sort -u | sed 's|apps/||' || true)
          if [ -z "$APPS" ]; then
            echo "No app changes → skip deploy"
            echo "apps=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON=$(echo "$APPS" | jq -R . | jq -s -c .)
          echo "Changed apps: $JSON"
          echo "apps=$JSON" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/${{ matrix.app }}
        run: pnpm --filter "@portfolio/${{ matrix.app }}" run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ matrix.app }}/dist --project-name=portfolio-${{ matrix.app }} --branch=main
