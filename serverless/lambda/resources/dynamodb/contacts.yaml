# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI.
# DynamoDB ContactsTable (form de contacto). devtools lo provisiona con
# `aws dynamodb create-table` y publica name/arn/stream-arn en SSM.
kind: dynamodb-table
name: portfolio-contacts-${stage}
billing_mode: PAY_PER_REQUEST
hash_key: { name: id, type: S }
range_key: null
stream: NEW_AND_OLD_IMAGES
point_in_time_recovery: true
encryption: true
ttl_attribute: null
publishes_ssm:
  name: /portfolio/${stage}/dynamodb/contacts/name
  arn: /portfolio/${stage}/dynamodb/contacts/arn
  stream_arn: /portfolio/${stage}/dynamodb/contacts/stream-arn
tags: { Project: portfolio, ManagedBy: devtools }
