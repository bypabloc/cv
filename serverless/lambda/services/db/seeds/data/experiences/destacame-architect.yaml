    - >-
      Lideré técnicamente equipos de entre cuatro y seis personas, sosteniendo la entrega de
      soluciones a través de reorganizaciones y reducciones de personal.
    - >-
      Contribuí de forma significativa a productos fintech en uso real, adquiriendo conocimiento
