caseStudy:
  es: >-
    Problema: posicionarme en varios nichos (fintech, arquitectura frontend, liderazgo, vibe coding)
    necesitaba mensajes distintos sin duplicar contenido ni mantenimiento. Solucion: monorepo Astro 6
    con seis sitios que comparten packages de contenido, UI y SEO; el mismo CV se filtra y reordena
    por nicho. Impacto: una sola fuente de verdad alimenta seis portfolios optimizados para buscadores
    y para respuestas de IA (GEO/LLM-SEO).
  en: >-
    Problem: positioning myself across several niches (fintech, frontend architecture, leadership,
    vibe coding) required different messaging without duplicating content or maintenance. Solution:
    an Astro 6 monorepo with six sites sharing content, UI and SEO packages; the same CV is filtered
    and reordered per niche. Impact: a single source of truth feeds six portfolios optimized for
    search engines and for AI answers (GEO/LLM-SEO).
metrics:
  architecture: 6 Astro sites in one monorepo
  packages: 5 shared workspace packages (content, ui, app-shared, seo, cv-pdf)
  deploy: Cloudflare Pages, static output
  seo: Per-site JSON-LD Person + GEO/LLM-SEO optimization
metricsEstimated: false
caseStudyDetailed:
  problem:
    es: >-
      Un solo portfolio generalista diluye el mensaje para reclutadores de nichos distintos. Mantener
      varios sitios separados, en cambio, multiplica el contenido duplicado y el mantenimiento. El
      reto era servir mensajes especificos por nicho desde una unica fuente de verdad del CV.
    en: >-
      A single generalist portfolio dilutes the message for recruiters in different niches.
      Maintaining several separate sites, on the other hand, multiplies duplicated content and
      maintenance. The challenge was serving niche-specific messaging from a single source of truth
      for the CV.
  process:
    es: >-
      Disenie un monorepo Astro 6 con pnpm workspaces: seis apps (generic, hub, fintech, architect,
      leader, vibe) y cinco packages compartidos (content para los datos del CV con schemas Zod, ui
      para el design system, app-shared para layout y secciones, seo para JSON-LD y sitemap, cv-pdf
      para el render ATS-friendly). Los mismos datos del CV se filtran y reordenan por nicho. Biome v2
      unifica lint y formato; el output es estatico y se despliega en Cloudflare Pages. El contenido
      se optimiza tanto para buscadores como para respuestas de IA (GEO/LLM-SEO).
    en: >-
      I designed an Astro 6 monorepo with pnpm workspaces: six apps (generic, hub, fintech,
      architect, leader, vibe) and five shared packages (content for the CV data with Zod schemas, ui
      for the design system, app-shared for layout and sections, seo for JSON-LD and sitemap, cv-pdf
      for the ATS-friendly render). The same CV data is filtered and reordered per niche. Biome v2
      unifies linting and formatting; the output is static and deployed to Cloudflare Pages. Content
      is optimized for both search engines and AI answers (GEO/LLM-SEO).
  result:
    es: >-
      Una sola fuente de verdad del CV alimenta seis portfolios desplegados de forma independiente en
      Cloudflare Pages, cada uno con su posicionamiento y su JSON-LD Person. La arquitectura de
      packages compartidos mantiene el contenido sin duplicar y permite agregar un nicho nuevo sin
      reescribir el CV.
    en: >-
      A single source of truth for the CV feeds six portfolios deployed independently to Cloudflare
      Pages, each with its own positioning and JSON-LD Person. The shared-package architecture keeps
      content free of duplication and allows adding a new niche without rewriting the CV.
isConfidential: false
