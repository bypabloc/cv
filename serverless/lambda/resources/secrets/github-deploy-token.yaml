# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI necesarias.
# PAT fine-grained de GitHub scoped al repo bypabloc/cv con permiso
# "Actions: read and write" (nada mas). Lo usa el Lambda cv_admin
# (operation publish) para disparar workflow_dispatch de deploy-apps.yml.
# Generacion del valor: GitHub -> Settings -> Developer settings ->
# Fine-grained tokens -> repo bypabloc/cv -> Actions RW -> 1 año.
# Pegar en docker/env/server/.{dev,prod} como GITHUB_DEPLOY_TOKEN=<valor>;
# luego sincronizar a SSM con `sync_secrets --env=<X> --category=server`.
kind: ssm-parameter

name: github-deploy-token
description: PAT fine-grained (Actions RW en bypabloc/cv) para workflow_dispatch desde cv_admin

path: /portfolio/${stage}/github-deploy-token
ssm_type: SecureString
kms_key_alias: alias/portfolio-lambdas

# Mapeo .env -> Lambda.
# source_env_var: KEY que devtools busca en docker/env/server/.{env}
# target_env_var: env var del Lambda (path SSM en cloud, fallback en local)
source_env_var: GITHUB_DEPLOY_TOKEN
target_env_var: SSM_GITHUB_DEPLOY_TOKEN_PATH

stages: [dev, prod]
required: true

rotation:
  interval_days: 365

owners:
  - pacg1991@gmail.com

consumed_by:
  - cv_admin

tags:
  Project: portfolio
  Module: cv-admin
  ManagedBy: devtools
