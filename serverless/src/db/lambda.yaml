# Manifiesto del Lambda `db` — fuente de verdad de la configuracion.
#
# devtools genera el template.yaml SAM a partir de este archivo:
#   python devtools/run.py serverless sam-generate --path=serverless/src/db
#
# El template.yaml generado es EFIMERO (esta en .gitignore). NUNCA se
# edita a mano: se cambia este lambda.yaml y se regenera.
#
# El Lambda `db` gestiona el schema PostgreSQL del portfolio (Alembic).
# NO esta detras de API Gateway ni de DynamoDB Streams: se invoca directo
# (deploy hook / `aws lambda invoke`). Su stack es independiente y no
# importa nada del stack de infra.

# --- Obligatorios ---
name: portfolio-db
runtime: python3.13
handler: core.handler.lambda_handler

# --- Opcionales (con defaults) ---
memory: 512
timeout: 120
region: us-east-1
architecture: arm64

# Sin triggers: el Lambda db se invoca directo (no API GW, no Streams).
trigger:
  type: none

# IAM: SSM read del parametro neon-url por stage + KMS decrypt.
iam_statements:
  - effect: Allow
    actions:
      - ssm:GetParameter
    resource: 'arn:aws:ssm:${region}:${account_id}:parameter/portfolio/${stage}/neon-url'
  - effect: Allow
    actions:
      - kms:Decrypt
    resource: 'arn:aws:kms:${region}:${account_id}:key/*'
    condition:
      StringEquals:
        kms:ViaService: 'ssm.${region}.amazonaws.com'

# Variables de entorno por stage. 'default' aplica a todos los stages;
# las claves de un stage especifico sobrescriben las de 'default'.
environment:
  default:
    POWERTOOLS_SERVICE_NAME: db
    POWERTOOLS_METRICS_NAMESPACE: Portfolio
    LOG_LEVEL: INFO
    ENVIRONMENT: dev
  dev:
    ENVIRONMENT: dev
    SSM_NEON_URL_PATH: /portfolio/dev/neon-url
  stage:
    ENVIRONMENT: stage
    SSM_NEON_URL_PATH: /portfolio/stage/neon-url
  prod:
    ENVIRONMENT: prod
    LOG_LEVEL: WARNING
    SSM_NEON_URL_PATH: /portfolio/prod/neon-url
