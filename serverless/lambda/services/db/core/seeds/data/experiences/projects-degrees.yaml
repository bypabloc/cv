responsibilities:
  es:
    - >-
      Dirección de la reestructuración de los proyectos de grado de dos equipos que habían quedado
      bloqueados por dificultades técnicas.
    - >-
      Mentoría técnica de los integrantes de cada equipo, explicando cada implementación y el
      razonamiento detrás de las decisiones.
    - >-
      Definición de la arquitectura y del plan de trabajo necesario para encaminar ambos proyectos
      hacia su finalización.
    - >-
      Implementación completa de las soluciones técnicas requeridas para cumplir con los objetivos
      de cada proyecto de grado.
    - >-
      Diagnóstico de los puntos de falla en el código y la arquitectura heredados, priorizando lo
      crítico para la entrega.
    - >-
      Acompañamiento de los equipos en la preparación de la documentación y la defensa de sus
      proyectos.
  en:
    - >-
      Led the restructuring of the thesis projects of two teams that had stalled due to technical
      roadblocks.
    - >-
      Mentored the members of each team, explaining every implementation and the reasoning behind
      the decisions.
    - >-
      Defined the architecture and the work plan needed to steer both projects toward completion.
    - >-
      Fully implemented the technical solutions required to meet the objectives of each thesis
      project.
    - >-
      Diagnosed the failure points in the inherited code and architecture, prioritizing the
      critical work for delivery.
    - >-
      Supported the teams in preparing the documentation and the defense of their projects.
achievements:
  es:
    - >-
      Reencaminé y completé en aproximadamente una semana dos proyectos de grado que dos equipos no
      habían logrado terminar en varios meses.
    - >-
      Capacité a cerca de seis estudiantes de dos equipos, dejándolos en capacidad de explicar y
      sostener técnicamente sus propias soluciones.
    - >-
      Reduje el tiempo estimado de finalización de ambos proyectos de meses a días mediante un
      diagnóstico técnico preciso y un plan de trabajo claro.
    - >-
      Llevé ambos proyectos de un estado bloqueado a una entrega lista para defensa, sin perder el
      alcance original de cada uno.
  en:
    - >-
      Got two thesis projects back on track and finished them in roughly one week after two teams
      had failed to complete them over several months.
    - >-
      Coached around six students across two teams, leaving them able to explain and technically
      defend their own solutions.
    - >-
      Cut the estimated completion time of both projects from months to days through a precise
      technical diagnosis and a clear work plan.
    - >-
      Took both projects from a blocked state to a defense-ready delivery without losing the
      original scope of either one.
