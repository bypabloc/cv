# @i18n elements.es
# Labels reutilizables de UI en espanol. Identicos para las 6 apps.
# Validado por ElementsStringsSchema. Su par es elements.en.yaml — ambos
# archivos DEBEN tener exactamente las mismas claves (test de paridad).

# Items del menu de navegacion. `key` es estable; `label` es el texto visible.
# El href se construye en codigo (depende del locale y del basePrefix).
nav:
  - key: experience
    label: "Experiencia"
  - key: projects
    label: "Proyectos"
  - key: skills
    label: "Skills"
  - key: about
    label: "Sobre mí"
  - key: certificates
    label: "Certificados"
  - key: contact
    label: "Contacto"
  - key: hub
    label: "Otras vistas"
  - key: posts
    label: "Posts"

