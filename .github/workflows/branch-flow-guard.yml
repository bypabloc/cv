# @config branch-flow-guard.yml
# @description Enforce del flujo de promocion dev -> main.
#   Falla si un PR tiene como base la rama de entorno main pero su head NO
#   es la rama de origen permitida (dev). Evita promover a produccion desde
#   una rama de feature sin pasar por dev.
# @triggers pull_request (opened, reopened, synchronize, edited) a main
#
# Reglas:
#   - PR a `main` -> head debe ser `dev` (o `release/*` solo en emergencias)
#
# Flujo normal: PR directo dev -> main, mergeado con merge commit (NO
# rebase). El merge commit preserva los SHAs, asi que las ramas no
# divergen. Las `release/*` quedan permitidas solo como escape hatch para
# hotfixes / cherry-picks puntuales. Ver .claude/rules/git-workflow.md.
#
# Marcar este job como required status check en el ruleset de main para que
# el enforce sea real (no se puede mergear sin el check verde).
name: Branch Flow Guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main, master]

jobs:
  guard:
    name: Validate promotion source
    runs-on: ubuntu-24.04
    steps:
      - name: Check PR head matches the allowed promotion source
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            main|master)
              # A produccion se promueve desde dev (release/* solo en emergencias).
              case "$HEAD" in
                dev|release/*)
                  echo "OK: '$HEAD' es un origen valido para '$BASE'."
                  ;;
                *)
                  echo "::error::PR a '$BASE' debe venir de 'dev' o 'release/*', no de '$HEAD'."
                  echo "Flujo correcto: feature -> dev -> main."
                  echo "Ver .claude/rules/git-workflow.md (Branching strategy)."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "OK: '$BASE' no es una rama de entorno; sin restriccion de origen."
              ;;
          esac
