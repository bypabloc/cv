# @config: src/stream_processor/pyproject.toml
# @description: manifiesto de dependencias del Lambda stream_processor
#   (consume DynamoDB Streams -> escribe a Neon). Workspace member de
#   serverless/. Ver src/contact_form/pyproject.toml para el formato.

[project]
name = "stream-processor"
version = "0.1.0"
description = "Lambda que replica contacts/tracking de DynamoDB Streams a Neon."
requires-python = ">=3.13"

# Toca Neon via el ORM: psycopg (driver) + SQLAlchemy. pydantic valida el
# evento sintetico {operation, action, data} del estandar lambda-controller.
dependencies = [
  "aws-lambda-powertools[all]>=3.0.0,<4.0",
  "boto3>=1.34.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
]

[tool.uv]
package = false
