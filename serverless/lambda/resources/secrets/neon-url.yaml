# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI necesarias.
# SSM Parameter de la Neon PostgreSQL connection string (psycopg3 pooled).
kind: ssm-parameter

name: neon-url
description: Neon PostgreSQL connection string (pooled, sslmode=require)

path: /portfolio/${stage}/neon-url
ssm_type: SecureString
kms_key_alias: alias/portfolio-lambdas

source_env_var: DB_URL
target_env_var: SSM_NEON_URL_PATH

stages: [dev, stage, prod]
required: true

rotation:
  interval_days: 180

owners:
  - pacg1991@gmail.com

consumed_by:
  - contact_form
  - tracking_pixel
  - db
  - auth
  - users

tags:
  Project: portfolio
  ManagedBy: devtools
