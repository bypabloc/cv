# Portfolio - CI E2E compose.
#
# Optimizado para GitHub Actions: no levanta containers de Astro dev. En su
# lugar, asume que `pnpm install + pnpm build` ya corrieron en el runner host
# y monta cada `apps/<X>/dist` directo en nginx via include de configs.
#
# nginx sirve cada subdominio como estatico (igual a Cloudflare en prod).
# El container `feature` corre Playwright contra nginx via network_mode: host.

services:
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx-ci
    ports:
      - "${PROXY_PORT:-9972}:80"
    volumes:
      - ../nginx/ci.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/error-pages:/usr/share/nginx/error-pages:ro
      - ../nginx/services-page:/usr/share/nginx/services-page:ro
      - ../../apps/generic/dist:/usr/share/nginx/html/generic:ro
      - ../../apps/hub/dist:/usr/share/nginx/html/hub:ro
      - ../../apps/fintech/dist:/usr/share/nginx/html/fintech:ro
      - ../../apps/architect/dist:/usr/share/nginx/html/architect:ro
      - ../../apps/leader/dist:/usr/share/nginx/html/leader:ro
      - ../../apps/vibe/dist:/usr/share/nginx/html/vibe:ro
    restart: unless-stopped

  feature:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/feature/Dockerfile
    container_name: portfolio-feature-ci
    network_mode: host
    volumes:
      - ../..:/app
      - feature_node_modules_ci:/app/tests/feature/node_modules
    depends_on:
      nginx:
        condition: service_started
    profiles:
      - feature
    restart: "no"

volumes:
  feature_node_modules_ci:
