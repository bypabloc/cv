# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI.
# DynamoDB RateLimitRulesTable (rules por endpoint/IP/country, TTL). devtools
# la provisiona con `aws dynamodb create-table` + `update-time-to-live` y
# publica name/arn en SSM.
kind: dynamodb-table
name: portfolio-rate-limit-rules-${stage}
billing_mode: PAY_PER_REQUEST
hash_key: { name: rule_key, type: S }
range_key: { name: kind, type: S }
stream: null
point_in_time_recovery: false
encryption: true
ttl_attribute: expires_at
publishes_ssm:
  name: /portfolio/${stage}/dynamodb/rate-limit-rules/name
  arn: /portfolio/${stage}/dynamodb/rate-limit-rules/arn
tags: { Project: portfolio, ManagedBy: devtools }
