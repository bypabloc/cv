[project]
name = "portfolio-serverless"
version = "0.1.0"
description = "Backend serverless del portfolio: Lambdas + DynamoDB + SES + Neon"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Pablo Contreras" }]

# El raiz es el WORKSPACE de uv: no declara deps de runtime propias. Cada
# Lambda (workspace member en src/<lambda>/pyproject.toml) declara las
# suyas; cada subpaquete de shared/ declara las suyas en su pyproject.toml.
# El .venv del workspace instala la union de TODAS para dev local + tests.
dependencies = [
  "contact-form",
  "tracking-pixel",
  "db",
  "stream-processor",
]

[tool.uv.workspace]
# Los 4 Lambdas son workspace members. shared/ NO es member: sus
# subpaquetes no son packages instalables (package = false implicito,
# son codigo vendorizado), se resuelven por path en runtime/vendoring.
members = ["lambda/services/*"]

[tool.uv.sources]
contact-form = { workspace = true }
tracking-pixel = { workspace = true }
db = { workspace = true }
stream-processor = { workspace = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "moto[dynamodb,ses,sns,sqs,ssm,kms,events]>=5.0,<6.0",
  "responses>=0.25,<1.0",
  "freezegun>=1.4,<2.0",
  "hypothesis>=6.100,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "boto3-stubs[essential,ses,sns,ssm,kms,events,sqs,logs]>=1.34,<2.0",
  "cfn-lint>=1.10,<2.0",
  "respx>=0.23.1",
]

[tool.ruff]
line-length = 80
target-version = "py313"
# migrations/_archive/: runner SQL legacy archivado (ver
# .claude/rules/neon-management.md) — referencia historica, no se aplica.
extend-exclude = [
  ".aws-sam/",
  ".venv/",
  "events/*.json",
  "migrations/_archive/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = [
  "E501",   # line-length manejado por formatter
  "ANN401", # any explicit en argumentos kwargs
  "S101",   # asserts ok en tests
  "S311",   # random no-cryptographic ok
]

[tool.ruff.lint.per-file-ignores]
# Tests: el nombre del test es el contrato; las firmas no necesitan
# anotaciones de tipo. S105/S106 son falsos positivos (cf_token de
# Turnstile, no es un password).
"**/tests/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "S105", "S106"]
# El handler vive dentro de core/ y ajusta sys.path antes de importar
# (models./services./settings./utils./shared. resuelven en AWS y en
# invoke local). Los imports tras ese setup son intencionales: E402 no
# aplica.
"**/core/handler.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov-report=term-missing --cov-fail-under=80"
# Tests de la libreria comun. Los tests de cada Lambda viven dentro del
# Lambda (lambda/services/<lambda>/tests/) y se corren con
# `serverless tests --type=unit --lambda=<lambda>`.
testpaths = ["lambda/shared/tests"]
markers = [
  "unit: tests unitarios (rapidos, sin AWS real)",
  "integration: tests con AWS real (deployed o sam local)",
  "slow: tests > 1s",
]

[tool.coverage.run]
branch = true
source = ["lambda/services", "lambda/shared"]
# core/shared/ es la libreria comun vendorizada (efimera) dentro de cada
# Lambda: el coverage del Lambda mide solo SU codigo, no la copia de shared.
omit = ["**/__init__.py", "**/tests/*", "**/core/shared/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["lambda/services/", "lambda/shared/"]
# Alembic env.py + migraciones: scripts de config con la API dinamica de
# Alembic (op.*, callbacks con Literal). No es codigo de aplicacion.
exclude = ["lambda/shared/db/alembic/.*", "\\.aws-sam/.*"]
