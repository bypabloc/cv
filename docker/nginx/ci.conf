# Portfolio - nginx config (CI E2E).
#
# Sirve cada apps/<X>/dist como estatico (no proxy_pass a dev server).
# Asume que `pnpm build` ya corrio en el host runner antes del compose up.

# === localhost -> apps/generic/dist (the-full-stack.com en prod) ===
server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    add_header Cache-Control "no-cache" always;

    error_page 404 /4xx.html;
    error_page 500 502 503 504 /5xx.html;
    location = /4xx.html { root /usr/share/nginx/error-pages; internal; }
    location = /5xx.html { root /usr/share/nginx/error-pages; internal; }

    location / {
        root /usr/share/nginx/html/generic;
        try_files $uri $uri/ $uri.html /index.html;
    }
}

