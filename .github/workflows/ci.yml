name: CI

on:
  pull_request:
    branches: [main, master, dev, stage]
  push:
    branches: [main, dev, stage]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.9"

jobs:
  # --------------------------------------------------------------------------
  # Quality gates: lint + typecheck + unit + build estático.
  # E2E (Playwright) NO corre en CI: es lento y los tests reales viven en
  # pre-push del hook local. Ver .claude/rules/verify-before-done.md.
  # --------------------------------------------------------------------------
  quality-gates:
    name: Lint + Typecheck + Unit + Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm exec biome check .

      - name: TypeScript check (packages)
        run: pnpm -r --filter "./packages/*" run typecheck

      - name: Astro check (apps)
        run: pnpm -r --filter "./apps/*" exec astro check

      - name: Unit tests with coverage
        run: pnpm -r --filter "./packages/*" run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/*/coverage
          if-no-files-found: ignore

      - name: Build cv-filters bundle (needed by apps prebuild)
        run: pnpm --filter @portfolio/cv-filters run build

      - name: Build all apps (matrix-free)
        run: pnpm -r --filter "./apps/*" run build

      - name: Upload dist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-all-apps
          path: apps/*/dist
          retention-days: 7
          if-no-files-found: warn
