# Esquema devtools — NO CloudFormica: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI necesarias.
# SSM Parameter del email destino del form de contacto (no secreto).
kind: ssm-parameter

name: owner-email
description: Email destino del form de contacto

# Path global compartido por todos los stages (sin ${stage}).
path: /portfolio/owner-email
ssm_type: String

source_env_var: OWNER_EMAIL
target_env_var: SSM_OWNER_EMAIL_PATH

stages: [dev, stage, prod]
required: true

owners:
  - pacg1991@gmail.com

consumed_by:
  - contact_form

tags:
  Project: portfolio
  ManagedBy: devtools
