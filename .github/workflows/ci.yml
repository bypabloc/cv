name: CI

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.9"
  UV_VERSION: "0.9.30"

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Quality gates nativos (lint + typecheck + unit + build)
  # Sin Docker — corre en runner GitHub directo. Mas rapido que Docker.
  # --------------------------------------------------------------------------
  quality-gates:
    name: Lint + Typecheck + Unit + Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm exec biome check .

      - name: TypeScript check (packages)
        run: pnpm -r --filter "./packages/*" run typecheck

      - name: Astro check (apps)
        run: pnpm -r --filter "./apps/*" exec astro check

      - name: Unit tests with coverage
        run: pnpm -r --filter "./packages/*" run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: packages/*/coverage
          if-no-files-found: ignore

      - name: Build all apps (matrix-free)
        run: pnpm -r --filter "./apps/*" run build

      - name: Upload dist artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-all-apps
          path: apps/*/dist
          retention-days: 7
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Job 2: E2E tests (Playwright) con Docker stack completo
  # Levanta nginx + las 6 apps con `docker compose` y corre los specs E2E.
  # Solo se ejecuta si hay cambios en apps/, packages/, docker/ o tests/.
  # --------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests (Playwright + Docker)
    needs: quality-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv ${{ env.UV_VERSION }}
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "devtools/uv.lock"

      - name: Detect changed areas
        id: detect
        run: |
          if [ -f devtools/uv.lock ]; then
            uv sync --frozen --project devtools 2>&1 || true
            uv run --project devtools python .git-hooks/_ci_detect.py
          else
            # Sin devtools sincronizados, default a "necesita docker"
            echo "needs_docker=true" >> "$GITHUB_OUTPUT"
            echo "needs_node=true" >> "$GITHUB_OUTPUT"
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        if: steps.detect.outputs.needs_node == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        if: steps.detect.outputs.needs_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (host)
        if: steps.detect.outputs.needs_node == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create env file (test)
        if: steps.detect.outputs.needs_docker == 'true'
        run: |
          cat > docker/env/.test << 'EOF'
          PROXY_PORT=9972
          SITE_URL_GENERIC=http://localhost
          SITE_URL_HUB=http://hub.localhost
          SITE_URL_FINTECH=http://fintech.localhost
          SITE_URL_ARCHITECT=http://architect.localhost
          SITE_URL_LEADER=http://leader.localhost
          SITE_URL_VIBE=http://vibe.localhost
          CI=true
          EOF

      - name: Build + start Docker stack (test env)
        if: steps.detect.outputs.needs_docker == 'true'
        run: |
          docker compose --project-name portfolio \
            -f docker/docker-compose/test.yml \
            --env-file docker/env/.test \
            up -d --build

      - name: Wait for apps to be healthy
        if: steps.detect.outputs.needs_docker == 'true'
        run: |
          echo "Esperando a que las 6 apps respondan via nginx..."
          for HOST in localhost hub.localhost fintech.localhost \
                     architect.localhost leader.localhost vibe.localhost; do
            echo "Probing http://${HOST}:9972/ ..."
            for i in $(seq 1 60); do
              if curl -sf -m 5 -H "Host: ${HOST}" "http://localhost:9972/" > /dev/null 2>&1; then
                echo "  ${HOST} OK (intento $i)"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "  ${HOST} TIMEOUT despues de 60 intentos (300s)"
                docker compose -p portfolio -f docker/docker-compose/test.yml logs --tail=80 || true
                exit 1
              fi
              sleep 5
            done
          done

      - name: Start feature container (Playwright)
        if: steps.detect.outputs.needs_docker == 'true'
        run: |
          docker compose --project-name portfolio \
            -f docker/docker-compose/test.yml \
            --env-file docker/env/.test \
            --profile feature up -d feature

      - name: Wait for feature container ready
        if: steps.detect.outputs.needs_docker == 'true'
        run: |
          echo "Esperando feature container..."
          for i in $(seq 1 60); do
            if docker exec portfolio-feature-test test -f /tmp/.feature-ready 2>/dev/null; then
              echo "feature ready (intento $i)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "feature timeout"
              docker logs portfolio-feature-test 2>&1 | tail -80 || true
              exit 1
            fi
            sleep 5
          done

      - name: Run E2E tests
        if: steps.detect.outputs.needs_docker == 'true'
        env:
          CI: "true"
        run: |
          docker exec -e CI=true portfolio-feature-test pnpm test || RC=$?
          exit ${RC:-0}

      - name: Collect Playwright report
        if: always() && steps.detect.outputs.needs_docker == 'true'
        run: |
          docker cp portfolio-feature-test:/app/tests/feature/report ./playwright-report 2>/dev/null || true
          docker cp portfolio-feature-test:/app/tests/feature/results ./playwright-results 2>/dev/null || true

      - name: Upload Playwright report
        if: always() && steps.detect.outputs.needs_docker == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: warn

      - name: Stop Docker stack
        if: always() && steps.detect.outputs.needs_docker == 'true'
        run: |
          docker compose --project-name portfolio \
            -f docker/docker-compose/test.yml down -v || true
