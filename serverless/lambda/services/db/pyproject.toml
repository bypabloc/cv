# @config: src/db/pyproject.toml
# @description: manifiesto de dependencias del Lambda db (gestion del
#   schema PostgreSQL via Alembic). Workspace member de serverless/.
#   Ver src/contact_form/pyproject.toml para el formato.

[project]
name = "db"
version = "0.1.0"
description = "Lambda de gestion del schema PostgreSQL del portfolio (Alembic)."
requires-python = ">=3.13"

# El core/ del Lambda solo importa pydantic (modelos del payload). El
# resto (powertools, boto3, sqlalchemy, alembic, psycopg) le llega por el
# vendoring del cierre de shared/ (shared.db, shared.observability,
# shared.lambda_kit) — ver la regla de dedup D-3 del plan
# docs/specs/serverless-lambda-independence/.
dependencies = [
  "pydantic>=2.5,<3.0",
]

[tool.uv]
package = false
