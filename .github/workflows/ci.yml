name: CI

on:
  pull_request:
    branches: [main, master, dev, stage]
  push:
    branches: [main, dev, stage]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.9"

jobs:
  # --------------------------------------------------------------------------
  # Quality gates SIMPLIFICADO: solo conformance + build estatico.
  #
  # El pre-push hook local SIEMPRE corre la bateria completa (lint +
  # typecheck + unit + coverage + build + E2E). CI es la red de
  # seguridad para `--no-verify` y colaboradores sin el hook setup —
  # cubrir el subset que detecta deploys rotos basta.
  #
  # typecheck y unit tests viven en pre-push (ver .git-hooks/pre-push).
  # astro check duplica el parsing que ya hace astro build, asi que se
  # elimina. Coverage no es required check; si se quiere visibilidad en
  # PRs, agregar Codecov en un PR aparte.
  # --------------------------------------------------------------------------
  quality-gates:
    name: Lint + Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # depth=1 alcanza: no necesitamos historia

      - name: Setup pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm exec biome check .

      - name: Build cv-filters bundle (needed by apps prebuild)
        run: pnpm --filter @portfolio/cv-filters run build

      - name: Build all apps (con prod defaults — validacion only)
        # ci.yml NO deploya; solo valida que el build no tenga errores.
        # Las env vars reales por env (dev/stage/prod) las inyecta
        # deploy-apps.yml desde GH Environment Variables (vars.*).
        # Aqui usamos defaults de prod para que el guard de
        # TrackingPixel.astro (validateApiEndpoint) no rechace el build
        # por env vars vacias. El artifact resultante NO se usa para
        # deploy real — deploy-apps.yml siempre rebuildea.
        env:
          BASE_DOMAIN: portfolio.the-full-stack.com
          APEX_DOMAIN: the-full-stack.com
          BASE_SCHEME: https
          PUBLIC_API_ENDPOINT: https://api.portfolio.the-full-stack.com
          PUBLIC_TURNSTILE_SITEKEY: ci-validation-only-not-real
        run: pnpm -r --filter "./apps/*" --workspace-concurrency=6 run build

      # El artifact dist-all-apps-<sha> lo descarga deploy-apps.yml para
      # evitar rebuild en el deploy. Solo se sube en push a env branches
      # (en PRs no hace falta porque no se deploya — ahorra storage).
      - name: Upload dist artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist-all-apps-${{ github.sha }}
          path: apps/*/dist
          retention-days: 7
          if-no-files-found: warn
