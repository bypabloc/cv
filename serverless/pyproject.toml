# @config: serverless/pyproject.toml
# @description: config de los tests CENTRALIZADOS de la libreria comun
#   shared/ (viven en lambda/shared/tests/). NO es un workspace uv: el
#   workspace se elimino (plan serverless-lambda-independence). Cada
#   lambda y cada subpaquete de shared/ tiene su propio pyproject.toml +
#   uv.lock + .venv aislado. Este archivo solo concentra la config de
#   pytest/coverage/ruff/mypy de la suite centralizada de shared/.

[project]
name = "portfolio-serverless"
version = "0.1.0"
description = "Backend serverless del portfolio: Lambdas + DynamoDB + SES + Neon"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Pablo Contreras" }]

# Sin [tool.uv.workspace]: cada paquete es autonomo.
#
# [project.dependencies] = UNION de las deps de runtime de los 9
# subpaquetes de shared/. La suite CENTRALIZADA de shared/
# (lambda/shared/tests/) importa shared.core, shared.db, shared.http,
# etc., asi que el `.venv` de `serverless/` necesita esas deps. Cada
# subpaquete declara las SUYAS en su propio pyproject.toml (fuente de
# verdad); esta lista es su union, para el entorno de test de shared/.
dependencies = [
  "aws-lambda-powertools[all]>=3.0.0,<4.0",
  "boto3>=1.34.0,<2.0",
  "pydantic[email]>=2.5,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "httpx>=0.27.0,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

# Deps para correr la suite CENTRALIZADA de shared/ (lambda/shared/tests/).
# Cada subpaquete de shared/ y cada lambda tiene ademas su propio grupo
# dev en su pyproject.toml para su .venv aislado.
[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "moto[dynamodb,ses,sns,sqs,ssm,kms,events]>=5.0,<6.0",
  "responses>=0.25,<1.0",
  "freezegun>=1.4,<2.0",
  "hypothesis>=6.100,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "boto3-stubs[essential,ses,sns,ssm,kms,events,sqs,logs]>=1.34,<2.0",
  "respx>=0.23.1",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [
  ".venv/",
  "build/",
  "events/*.json",
  "migrations/_archive/",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = [
  "E501",   # line-length manejado por formatter
  "ANN401", # any explicit en argumentos kwargs
  "S101",   # asserts ok en tests
  "S311",   # random no-cryptographic ok
]

[tool.ruff.lint.per-file-ignores]
# Tests: el nombre del test es el contrato; las firmas no necesitan
# anotaciones de tipo. S105/S106 son falsos positivos.
"**/tests/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "S105", "S106"]
"**/core/handler.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov-report=term-missing --cov-fail-under=80"
# Suite centralizada de la libreria comun. Los tests de cada Lambda
# viven dentro del Lambda (lambda/services/<lambda>/tests/) y se corren
# con `serverless tests --type=unit --lambda=<lambda>`.
testpaths = ["lambda/shared/tests"]
markers = [
  "unit: tests unitarios (rapidos, sin AWS real)",
  "integration: tests con AWS real (deployed)",
  "slow: tests > 1s",
]

[tool.coverage.run]
branch = true
source = ["lambda/shared"]
# core/shared/ es la libreria comun vendorizada (efimera) dentro de cada
# Lambda: el coverage mide solo el codigo fuente, no las copias.
omit = ["**/__init__.py", "**/tests/*", "**/core/shared/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["lambda/shared"]
# Alembic env.py + migraciones: scripts con la API dinamica de Alembic.
exclude = ["lambda/shared/db/alembic/.*"]
