# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI.
# SQS DLQ del stream_processor. devtools la provisiona con
# `aws sqs create-queue` y publica arn/url en SSM.
kind: sqs-queue
name: portfolio-stream-processor-dlq-${stage}
message_retention_seconds: 1209600
publishes_ssm:
  arn: /portfolio/${stage}/sqs/stream-processor-dlq/arn
  url: /portfolio/${stage}/sqs/stream-processor-dlq/url
tags: { Project: portfolio, ManagedBy: devtools }
