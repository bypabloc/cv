# Manifiesto del Lambda — fuente de verdad de la configuracion.
#
# devtools genera el template.yaml SAM a partir de este archivo:
#   python devtools/run.py serverless sam-generate --path=<este-dir>
#
# El template.yaml generado es EFIMERO (esta en .gitignore). NUNCA se
# edita a mano: se cambia este lambda.yaml y se regenera.

# --- Obligatorios ---
name: example-lambda                    # nombre logico (kebab-case)
runtime: python3.13                     # python3.12 | python3.13
handler: core.handler.lambda_handler    # el handler vive en core/

# --- Opcionales (con defaults) ---
memory: 256                             # MB    (default 256)
timeout: 30                             # seg   (default 30)
region: us-east-1                       # AWS region (default us-east-1)

# Layers ARN compartidos (opcional)
layers: []
# - arn:aws:lambda:us-east-1:000000000000:layer:shared-deps:1

# IAM: managed policy names o SAM policy templates (opcional)
iam_policies: []
# - AWSLambdaBasicExecutionRole
# - arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess

# Variables de entorno por stage. 'default' aplica a todos los stages;
# las claves de un stage especifico sobrescriben las de 'default'.
environment:
  default:
    LOG_LEVEL: INFO
    ENVIRONMENT: dev
  dev:
    ENVIRONMENT: dev
  stage:
    ENVIRONMENT: stage
  prod:
    LOG_LEVEL: WARNING
    ENVIRONMENT: prod
