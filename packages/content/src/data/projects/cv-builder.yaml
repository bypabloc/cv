metricsEstimated: false
caseStudyDetailed:
  problem:
    es: >-
      Las herramientas de CV existentes eran cerradas, mono-idioma o sin control sobre la URL
      publica. Queria una plataforma propia: editor con asistencia de IA, soporte multilenguaje real
      y un CV publicable como pagina con su propia direccion.
    en: >-
      Existing CV tools were closed, single-language or offered no control over the public URL. I
      wanted my own platform: an editor with AI assistance, real multilingual support and a CV
      publishable as a page with its own address.
  process:
    es: >-
      Disenie un monorepo full stack: landing en Astro 5, webapp SPA en Nuxt 4 con Pinia y TypeScript
      strict, y backend Django 6 + DRF con Celery, PostgreSQL y Redis. La autenticacion es
      email-first con JWT, MFA, passkeys y OAuth. El servicio de IA abstrae varios proveedores
      (Claude API y OpenAI) detras de una interfaz comun, con las API keys aportadas por cada
      usuario. Todo orquestado con Docker Compose. Construido con Claude Code y revision humana en
      cada commit.
    en: >-
      I designed a full stack monorepo: an Astro 5 landing, a Nuxt 4 SPA webapp with Pinia and strict
      TypeScript, and a Django 6 + DRF backend with Celery, PostgreSQL and Redis. Authentication is
      email-first with JWT, MFA, passkeys and OAuth. The AI service abstracts several providers
      (Claude API and OpenAI) behind a common interface, using API keys supplied by each user.
      Everything is orchestrated with Docker Compose. Built with Claude Code and human review on
      every commit.
  result:
    es: >-
      Plataforma activa en bypabloc/cv que permite crear, editar y publicar CVs profesionales
      multilenguaje, con editor asistido por IA y cada CV accesible en /cv/<slug>/<lang>. Demuestra
      la entrega de un producto full stack completo manteniendo mantenibilidad y revision humana del
      codigo.
    en: >-
      Active platform at bypabloc/cv that lets users create, edit and publish multilingual
      professional CVs, with an AI-assisted editor and each CV reachable at /cv/<slug>/<lang>. It
      demonstrates shipping a complete full stack product while keeping maintainability and human
      code review.
