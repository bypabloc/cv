# Manifiesto del Lambda `cv_admin` — fuente de verdad de su config.
#
# HTTP encoder de la gestion del CV (plan c-cv-management): operation
# `content` (escritura de las entidades cv_* en Neon via la capa
# shared.db.repositories.cv_write*) y operation `publish` (dispara y
# consulta el workflow deploy-apps.yml via la GitHub API). TODAS las
# actions requieren access JWT + scope admin (whitelist SSM
# admin-emails); NO usa Turnstile (ya autenticado). Sigue el patron
# lambda-controller con operation+action + http_handler.
#
# devtools traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=cv_admin

# --- Identidad ---
name: cv_admin
description: HTTP endpoint POST /cv-admin (escritura del CV + publish).

# --- Runtime ---
runtime: python3.13
memory: 1024      # MB — PISO del proyecto (.claude/rules/lambda-config.md):
                  # TODOS los lambdas declaran 1024 como minimo (memoria==CPU,
                  # decision 2026-06-10). Subir por encima requiere medicion
                  # documentada; bajar esta prohibido.
timeout: 30       # segundos — cubre el cold SIN SnapStart restore: medido
                  # Init ~3.2s + handler worst-case ~8.5s (Neon I/O) ~ 12s.
handler: core.handler.lambda_handler

# SnapStart DESACTIVADO (2026-06): el storage del snapshot se factura por
# hora por cada version publicada y NO entra en el free tier. El cold
# start lo mitiga la carga lazy de shared. Ver .claude/rules/lambda-config.md.
snap_start: false

# --- Como se invoca este Lambda ---
trigger:
  type: http
  method: POST
  path: /cv-admin

# --- Que recursos del backend usa ---
uses:
  # Tablas DynamoDB: cache (invalidacion por tag 'cv' tras cada escritura;
  # shared.rate_limit usa @cached para las rules) + rate-limit per-IP +
  # jwt-blacklist (solo lookup del jti del access JWT — cv_admin NO
  # blacklistea, eso es del Lambda auth/users).
  tables:
    cache: read-write
    jwt-blacklist: read
    rate-limit-rules: read
    rate-limit-buckets: read-write
  # Secretos que el Lambda lee de SSM (solo el nombre corto).
  secrets:
    - neon-url             # connection string Neon (escritura cv_*)
    - jwt-secret           # verifica el access JWT (HS256)
    - admin-emails         # whitelist del scope admin (TODAS las actions)
    - github-deploy-token  # PAT fine-grained (Actions RW en bypabloc/cv)
  # El Lambda NO envia email.
  sends-email: false

# --- Variables de entorno por entorno ---
env:
  default:
    LOG_LEVEL: INFO
    POWERTOOLS_SERVICE_NAME: cv_admin
    POWERTOOLS_METRICS_NAMESPACE: Portfolio/CvAdmin
    JWT_ISSUER: portfolio-auth
    JWT_AUDIENCE: portfolio
  dev:
    LOG_LEVEL: INFO
    CORS_ALLOWED_ORIGINS: 'https://admin.portfolio.dev.the-full-stack.com'
  prod:
    LOG_LEVEL: WARNING
    CORS_ALLOWED_ORIGINS: 'https://admin.portfolio.the-full-stack.com'
