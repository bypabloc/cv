# ============================================================================
# DynamoDB: TrackingTable — eventos de tracking pixel (TTL 60d)
# ============================================================================

Resources:
  TrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-tracking-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: page_id
          AttributeType: S
        # Atributos del GSI niche-created_at-index.
        - AttributeName: niche
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: page_id
          KeyType: RANGE
      # GSI: queries de dashboard por nicho ordenadas por fecha sin full
      # scan. El esquema lo declara tambien TrackingEventItem.Meta (ORM);
      # `check_schema` verifica que ambos no diverjan.
      GlobalSecondaryIndexes:
        - IndexName: niche-created_at-index
          KeySchema:
            - AttributeName: niche
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

Outputs:
  TrackingTableName:
    Value: !Ref TrackingTable
    Export:
      Name: !Sub portfolio-infra-${Stage}-TrackingTableName
  TrackingTableArn:
    Value: !GetAtt TrackingTable.Arn
    Export:
      Name: !Sub portfolio-infra-${Stage}-TrackingTableArn
  TrackingStreamArn:
    Value: !GetAtt TrackingTable.StreamArn
    Export:
      Name: !Sub portfolio-infra-${Stage}-TrackingStreamArn
