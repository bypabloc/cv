# @config: pyproject.toml del scaffold lambda-controller
# @description: manifiesto de dependencias del Lambda. Reemplaza a
#   requirements.txt + requirements-dev.txt + pytest.ini. Las deps de
#   runtime van en [project.dependencies]; las de test en
#   [dependency-groups] dev; la config de pytest en
#   [tool.pytest.ini_options]. devtools gestiona las deps con uv.
#
# Al instanciar el scaffold: reemplazar <NOMBRE_DEL_SERVICIO> y ajustar
# las dependencias reales que el Lambda importa.

[project]
name = "<NOMBRE_DEL_SERVICIO>"
version = "0.1.0"
description = "Lambda <NOMBRE_DEL_SERVICIO> (formato lambda-controller)."
requires-python = ">=3.13"

# Deps de runtime: SOLO las que el codigo del Lambda importa realmente.
# boto3 viene preinstalado en el runtime de AWS Lambda; pinnearlo aqui
# solo si se necesita una version concreta o para correr en local.
dependencies = [
  "pydantic>=2,<3",
  # "boto3>=1.34",
]

[dependency-groups]
# Deps de test (no entran al artefacto de deploy).
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Correr desde la raiz del Lambda: pytest tests/unit | pytest tests/integration
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
  "unit: tests unitarios (rapidos, sin AWS real)",
  "integration: tests con AWS real (deployed o sam local)",
]
