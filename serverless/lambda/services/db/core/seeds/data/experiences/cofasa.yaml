responsibilities:
  es:
    - >-
      Desarrollo de un sistema web con jQuery y Laravel para el monitoreo del proceso de producción,
      registrando paradas de máquina para el análisis de productividad.
    - >-
      Implementación del sistema en toda la empresa sobre la red local, con acceso seguro mediante
      usuario y contraseña para cada empleado.
    - >-
      Modelado de la base de datos relacional para registrar eventos de producción, tiempos de
      parada y sus causas asociadas.
    - >-
      Construcción de reportes y vistas de análisis que transformaron los datos crudos de planta en
      indicadores accionables.
    - >-
      Levantamiento de requerimientos con el personal de producción para reflejar fielmente el
      proceso real de la planta.
    - >-
      Mantenimiento y ajuste continuo del sistema según la retroalimentación de los usuarios y la
      evolución de la operación.
  en:
    - >-
      Built a web system with jQuery and Laravel to monitor the production process, recording
      machine stops for productivity analysis.
    - >-
      Deployed the system company-wide over the LAN, with secure per-user authentication for every
      employee.
    - >-
      Modeled the relational database to record production events, downtime and their associated
      causes.
    - >-
      Built reports and analysis views that turned raw plant data into actionable indicators.
    - >-
      Gathered requirements with production staff to faithfully reflect the plant's real process.
    - >-
      Maintained and continuously tuned the system based on user feedback and the evolving
      operation.
achievements:
  es:
    - >-
      Contribuí al aumento de la productividad mediante el análisis de los datos generados por el
      sistema, habilitando decisiones informadas para mejorar procesos.
    - >-
      Reemplacé el registro manual de paradas de máquina en planillas de papel por una captura
      digital centralizada y consultable.
    - >-
      Reduje el tiempo de elaboración de reportes de productividad de varias horas de consolidación
      manual a una consulta directa en el sistema.
    - >-
      Di visibilidad por primera vez a las causas de parada más frecuentes, lo que permitió priorizar
      acciones correctivas concretas.
    - >-
      Sostuve un sistema en uso productivo durante casi dos años, adaptándolo a las necesidades
      cambiantes de la operación.
  en:
    - >-
      Improved productivity through analysis of the data generated by the system, enabling informed
      process-improvement decisions.
    - >-
      Replaced manual machine-stop logging on paper sheets with centralized, searchable digital
      capture.
    - >-
      Cut productivity report preparation from several hours of manual consolidation to a direct
      query in the system.
    - >-
      Gave first-time visibility into the most frequent downtime causes, enabling concrete
      corrective-action prioritization.
    - >-
      Kept a system in productive use for nearly two years, adapting it to the operation's changing
      needs.
