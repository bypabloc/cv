# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI necesarias.
# SSM Parameter de la From address verificada en SES (no secreto).
kind: ssm-parameter

name: ses-from-address
description: From address verificada en SES (Domain Identity)

# Path global compartido por todos los stages.
path: /portfolio/ses-from-address
ssm_type: String

source_env_var: EMAIL_FROM
target_env_var: SSM_SES_FROM_ADDRESS_PATH

stages: [dev, stage, prod]
required: true

owners:
  - pacg1991@gmail.com

consumed_by:
  - contact_form

tags:
  Project: portfolio
  ManagedBy: devtools
