# Portfolio - dev compose (HMR, code baked, puerto 9971).

x-app-environment: &app-environment
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  BASE_SCHEME: ${BASE_SCHEME:-http}
  BASE_PORT: ${BASE_PORT:-9971}
  # Backend serverless (vienen de docker/env/client/.dev — categoria
  # client, valores publicos). Astro los lee como import.meta.env.PUBLIC_*
  # y los inlinea en el bundle del browser.
  PUBLIC_API_ENDPOINT: ${PUBLIC_API_ENDPOINT:-}
  PUBLIC_TURNSTILE_SITEKEY: ${PUBLIC_TURNSTILE_SITEKEY:-}

# Env vars del admin (Next.js). Next lee process.env.NEXT_PUBLIC_* en
# build/dev y las inlinea en el bundle del browser. Vienen de
# docker/env/client/.dev (categoria client, valores publicos).
x-admin-environment: &admin-environment
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  BASE_SCHEME: ${BASE_SCHEME:-http}
  BASE_PORT: ${BASE_PORT:-9971}
  NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-}
  NEXT_PUBLIC_TURNSTILE_SITEKEY: ${NEXT_PUBLIC_TURNSTILE_SITEKEY:-}
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
  NEXT_PUBLIC_AUTH_REFRESH_LEAD_MS: ${NEXT_PUBLIC_AUTH_REFRESH_LEAD_MS:-30000}
  NEXT_PUBLIC_WEBAUTHN_RP_ID: ${NEXT_PUBLIC_WEBAUTHN_RP_ID:-}
  NEXT_PUBLIC_FEATURE_MFA: ${NEXT_PUBLIC_FEATURE_MFA:-true}

services:
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx-dev
    ports:
      - "${PROXY_PORT:-9971}:80"
    volumes:
      - ../nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/error-pages:/usr/share/nginx/error-pages:ro
      - ../nginx/services-page:/usr/share/nginx/services-page:ro
    depends_on:
      generic:
        condition: service_started
      hub:
        condition: service_started
      fintech:
        condition: service_started
      architect:
        condition: service_started
      leader:
        condition: service_started
      vibe:
        condition: service_started
      admin:
        condition: service_started
    restart: unless-stopped

  generic:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/dev/generic/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-generic-dev
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  hub:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/dev/hub/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-hub-dev
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  fintech:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/dev/fintech/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-fintech-dev
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  architect:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/dev/architect/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-architect-dev
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  leader:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/dev/leader/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-leader-dev
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  vibe:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/dev/vibe/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-vibe-dev
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  # Admin panel (Next.js SPA). Dev server (HMR) en el puerto 3000.
  admin:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/dev/admin/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-admin-dev
    environment: *admin-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  # E2E unificado (Python 3.14 + playwright-python). On-demand via
  # `profile: [e2e]`. Corre contra el backend DESPLEGADO (dev), NO
  # contra el stack local: `network_mode: host` (salida a internet) +
  # ~/.aws montado read-only para resolver SSM/Neon. El sentinel
  # /tmp/.e2e-ready lo crea e2e-entrypoint.sh.
  e2e:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/dev/e2e/Dockerfile
    container_name: portfolio-e2e-dev
    network_mode: host
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ../..:/app
      - ${HOME}/.aws:/root/.aws:ro
      - e2e_venv:/app/devtools/.venv
    profiles:
      - e2e
    restart: "no"

volumes:
  portfolio_node_modules:
  e2e_venv:
