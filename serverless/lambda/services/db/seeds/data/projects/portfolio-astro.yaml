description:
  es: >-
    Arquitectura monorepo con DS unificado, content collections compartidas, filtrado por nicho,
    dark/light/system theme y JSON-LD Person por sitio. Seis apps (generic, hub, fintech, architect,
    leader, vibe) consumen packages compartidos para contenido, UI, layout y SEO. Meta caso de
    estudio del stack.
  en: >-
    Monorepo architecture with a unified DS, shared content collections, niche-based filtering,
    dark/light/system theming and per-site JSON-LD Person. Six apps (generic, hub, fintech,
    architect, leader, vibe) consume shared packages for content, UI, layout and SEO. Meta case
    study of the stack.
