# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI necesarias.
# Lista coma-separada de emails admin (whitelist) del scope `admin.*` del
# Lambda `users`. Rotar admins = editar este secret en SSM (sin tocar
# codigo ni DB). Generacion del valor: pegar los emails separados por coma
# en docker/env/server/.{dev,prod} como ADMIN_EMAILS=a@x.com,b@y.com;
# luego sincronizar a SSM con `serverless sync-secrets --stage=<X>`.
kind: ssm-parameter

name: admin-emails
description: Lista coma-separada de emails admin (whitelist del scope admin.*)

path: /portfolio/${stage}/admin-emails
ssm_type: SecureString
kms_key_alias: alias/portfolio-lambdas

# Mapeo .env -> Lambda.
# source_env_var: KEY que devtools busca en docker/env/server/.{env}
# target_env_var: env var del Lambda (path SSM en cloud, fallback en local)
source_env_var: ADMIN_EMAILS
target_env_var: SSM_ADMIN_EMAILS_PATH

stages: [dev, prod]
required: true

rotation:
  interval_days: 365

owners:
  - pacg1991@gmail.com

consumed_by:
  - users

tags:
  Project: portfolio
  Module: auth
  ManagedBy: devtools
