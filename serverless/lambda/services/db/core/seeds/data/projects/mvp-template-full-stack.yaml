caseStudyDetailed:
  problem:
    es: >-
      Arrancar un proyecto full stack nuevo significaba repetir cada vez la misma configuracion:
      estructura del harness de Claude Code, quality gates, convenciones de codigo y tooling. Sin un
      punto de partida estandar, cada repo divergia y el setup consumia tiempo antes de escribir la
      primera linea de producto.
    en: >-
      Bootstrapping a new full stack project meant repeating the same setup every time: the Claude
      Code harness structure, quality gates, code conventions and tooling. Without a standard
      starting point, each repo diverged and setup consumed time before writing the first line of
      product code.
  process:
    es: >-
      Construi un template publico con el flujo vibe coding completo: harness de Claude Code con
      skills, rules y hooks; stack Astro 6 + Django listo para usar; quality gates en pre-commit y
      pre-push (conformance, typecheck, tests); y un CLI de devtools en Python 3.14 con uv para
      orquestar tareas. Biome v2 unifica lint y formato. Es el mismo patron que adopte al introducir
      Claude Code en el equipo de Destacame.
    en: >-
      I built a public template with the full vibe coding workflow: a Claude Code harness with
      skills, rules and hooks; a ready-to-use Astro 6 + Django stack; quality gates in pre-commit and
      pre-push (conformance, typecheck, tests); and a Python 3.14 devtools CLI with uv to orchestrate
      tasks. Biome v2 unifies linting and formatting. It is the same pattern I adopted when rolling
      out Claude Code on the Destacame team.
  result:
    es: >-
      Template reutilizable que reduce el setup de un proyecto full stack nuevo a clonar y adaptar,
      con el harness de Claude Code y los quality gates ya configurados. Sirvio de referencia para el
      rollout de Claude Code en Destacame y estandariza el flujo de trabajo entre proyectos.
    en: >-
      A reusable template that reduces the setup of a new full stack project to cloning and adapting,
      with the Claude Code harness and quality gates already configured. It served as the reference
      for the Claude Code rollout at Destacame and standardizes the workflow across projects.
