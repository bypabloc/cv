<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="3" />
  <title>Cargando...</title>
  <style>
    body {
      margin: 0; padding: 48px 24px;
      background: #0a0a0a; color: #f7f7f5;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      display: grid; place-items: center; min-height: 100vh; line-height: 1.6;
    }
    .box { max-width: 480px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #8a8a85; margin: 0; font-size: 14px; }
    .spinner {
      width: 32px; height: 32px; margin: 24px auto;
      border: 3px solid #2a2a2a;
      border-top-color: #4F6EF7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Servidor calentando...</h1>
    <p>El upstream esta arrancando. Esta página se recarga sola en 3 segundos.</p>
  </div>
</body>
</html>
