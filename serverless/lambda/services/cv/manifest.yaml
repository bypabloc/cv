# Manifiesto del Lambda `cv` — fuente de verdad de su config.
#
# Sirve el CV (lectura) desde Neon PostgreSQL via GET /cv. devtools
# traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=cv

# --- Identidad ---
name: cv
description: Sirve el CV (lectura) desde Neon PostgreSQL via GET /cv.

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 1024      # MB — PISO del proyecto (.claude/rules/lambda-config.md):
                  # TODOS los lambdas declaran 1024 como minimo (memoria==CPU,
                  # decision 2026-06-10). Subir por encima requiere medicion
                  # documentada; bajar esta prohibido.
timeout: 60       # segundos — colchon uniforme (cold sin restore + query).

# SnapStart DESACTIVADO (2026-06): el storage del snapshot
# (Lambda-SnapStart-Cached-GB-S) se factura por hora por cada version
# publicada y NO entra en el free tier (~$50/mes con 25 funciones). El
# handler de cv es Neon-I/O-bound; la palanca real es la query, no el
# restore. Re-evaluar solo si lo exige. Ver .claude/rules/lambda-config.md.
snap_start: false

# --- Trigger HTTP ---
trigger:
  type: http
  method: GET
  path: /cv

# --- Recursos que usa ---
uses:
  tables:
    cache: read-write          # @cached de las respuestas (CV cambia raramente)
  secrets:
    - neon-url                 # connection string PostgreSQL (SecureString)
  sends-email: false

# --- Variables de entorno por entorno ---
env:
  default:
    LOG_LEVEL: INFO
  dev:
    CORS_ALLOWED_ORIGINS: 'https://portfolio.dev.the-full-stack.com,https://hub.portfolio.dev.the-full-stack.com,https://fintech.portfolio.dev.the-full-stack.com,https://architect.portfolio.dev.the-full-stack.com,https://leader.portfolio.dev.the-full-stack.com,https://vibe.portfolio.dev.the-full-stack.com'
  prod:
    LOG_LEVEL: WARNING
    CORS_ALLOWED_ORIGINS: 'https://the-full-stack.com,https://www.the-full-stack.com,https://hub.portfolio.the-full-stack.com,https://fintech.portfolio.the-full-stack.com,https://architect.portfolio.the-full-stack.com,https://leader.portfolio.the-full-stack.com,https://vibe.portfolio.the-full-stack.com'
