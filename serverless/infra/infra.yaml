AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# ============================================================================
# Portfolio backend — stack de INFRA COMPARTIDA
# Region: us-east-1
# ============================================================================
# Stack 1 de 5 (ver tmp/arquitectura-5-stacks.md). Contiene los recursos que
# los 4 stacks de Lambda comparten: API Gateway REST (sin metodos — los
# agregan los stacks de contact_form y tracking_pixel), 5 tablas DynamoDB y
# la DLQ del stream_processor. Cada recurso publica Outputs con Export para
# que los stacks de Lambda los consuman via Fn::ImportValue.
#
# Deploy: python devtools/run.py serverless deploy-infra --stage=<stage>
# Orden: infra PRIMERO; los stacks de Lambda la importan. Para delete, los
# Lambdas primero (CloudFormation bloquea borrar un export en uso).
# ============================================================================

Description: >
  Portfolio backend — infra compartida: API Gateway REST + 5 tablas DynamoDB
  (contacts, tracking, cache, rate-limit x2) + DLQ del stream_processor.
  Los 4 stacks de Lambda importan estos recursos por Fn::ImportValue.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod
    Description: Ambiente del stack (dev | stage | prod).

Resources:
  # ==========================================================================
  # API Gateway REST + CloudWatch Access Log
  # ==========================================================================
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub portfolio-api-cwlogs-role-${Stage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/portfolio-api-${Stage}
      RetentionInDays: 7

  # API Gateway REST nativa (NO AWS::Serverless::Api): los metodos /contact
  # y /track los agregan los stacks de contact_form y tracking_pixel sobre
  # esta API por su Id. CloudFormation permite una REST API sin metodos.
  PortfolioApi:
    Type: AWS::ApiGateway::RestApi
    DependsOn: ApiGatewayAccount
    Properties:
      Name: !Sub portfolio-api-${Stage}
      Description: !Sub Portfolio backend API (${Stage})
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: ContactsTable — form de contacto
  # ==========================================================================
  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-contacts-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: TrackingTable — eventos de tracking pixel (TTL 60d)
  # ==========================================================================
  TrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-tracking-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: page_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: page_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: CacheTable — cache key-value (TTL, sin Streams)
  # ==========================================================================
  CacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-cache-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: RateLimitRulesTable — rules per-endpoint/IP/country
  # ==========================================================================
  RateLimitRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-rate-limit-rules-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rule_key
          AttributeType: S
        - AttributeName: kind
          AttributeType: S
      KeySchema:
        - AttributeName: rule_key
          KeyType: HASH
        - AttributeName: kind
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # DynamoDB: RateLimitBucketsTable — sliding window counters
  # ==========================================================================
  RateLimitBucketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-rate-limit-buckets-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bucket_key
          AttributeType: S
      KeySchema:
        - AttributeName: bucket_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # ==========================================================================
  # SQS: DLQ del stream_processor
  # ==========================================================================
  StreamProcessorDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub portfolio-stream-processor-dlq-${Stage}
      MessageRetentionPeriod: 1209600  # 14 dias
      VisibilityTimeout: 300

# ============================================================================
# Outputs: exportados para los 4 stacks de Lambda (Fn::ImportValue)
# ============================================================================
Outputs:
  ApiId:
    Description: REST API Id — contact_form y tracking_pixel agregan metodos
    Value: !Ref PortfolioApi
    Export:
      Name: !Sub portfolio-infra-${Stage}-ApiId

  ApiRootResourceId:
    Description: RootResourceId de la API — parent de /contact y /track
    Value: !GetAtt PortfolioApi.RootResourceId
    Export:
      Name: !Sub portfolio-infra-${Stage}-ApiRootResourceId

  ContactsTableName:
    Value: !Ref ContactsTable
    Export:
      Name: !Sub portfolio-infra-${Stage}-ContactsTableName
  ContactsTableArn:
    Value: !GetAtt ContactsTable.Arn
    Export:
      Name: !Sub portfolio-infra-${Stage}-ContactsTableArn
  ContactsStreamArn:
    Value: !GetAtt ContactsTable.StreamArn
    Export:
      Name: !Sub portfolio-infra-${Stage}-ContactsStreamArn

  TrackingTableName:
    Value: !Ref TrackingTable
    Export:
      Name: !Sub portfolio-infra-${Stage}-TrackingTableName
  TrackingTableArn:
    Value: !GetAtt TrackingTable.Arn
    Export:
      Name: !Sub portfolio-infra-${Stage}-TrackingTableArn
  TrackingStreamArn:
    Value: !GetAtt TrackingTable.StreamArn
    Export:
      Name: !Sub portfolio-infra-${Stage}-TrackingStreamArn

  CacheTableName:
    Value: !Ref CacheTable
    Export:
      Name: !Sub portfolio-infra-${Stage}-CacheTableName
  CacheTableArn:
    Value: !GetAtt CacheTable.Arn
    Export:
      Name: !Sub portfolio-infra-${Stage}-CacheTableArn

  RateLimitRulesTableName:
    Value: !Ref RateLimitRulesTable
    Export:
      Name: !Sub portfolio-infra-${Stage}-RateLimitRulesTableName
  RateLimitRulesTableArn:
    Value: !GetAtt RateLimitRulesTable.Arn
    Export:
      Name: !Sub portfolio-infra-${Stage}-RateLimitRulesTableArn

  RateLimitBucketsTableName:
    Value: !Ref RateLimitBucketsTable
    Export:
      Name: !Sub portfolio-infra-${Stage}-RateLimitBucketsTableName
  RateLimitBucketsTableArn:
    Value: !GetAtt RateLimitBucketsTable.Arn
    Export:
      Name: !Sub portfolio-infra-${Stage}-RateLimitBucketsTableArn

  StreamProcessorDLQArn:
    Value: !GetAtt StreamProcessorDLQ.Arn
    Export:
      Name: !Sub portfolio-infra-${Stage}-StreamProcessorDLQArn
  StreamProcessorDLQName:
    Value: !GetAtt StreamProcessorDLQ.QueueName
    Export:
      Name: !Sub portfolio-infra-${Stage}-StreamProcessorDLQName
