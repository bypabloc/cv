# @config: services/send_email/pyproject.toml
# @description: deps del Lambda send_email. El cierre de shared/ aporta
#   todo (aws + templating + observability + lambda_kit + core); aqui no
#   se declara ninguna dep de runtime directa.

[project]
name = "send-email-lambda"
requires-python = ">=3.13"
version = "0"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "moto[dynamodb,s3,ses,sns,ssm,kms]>=5.0,<6.0",
  "freezegun>=1.4,<2.0",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [".venv/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = [
  "E501",
  "ANN401",
  "S101",
  "S311",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "S105", "S106"]
"**/core/handler.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "unit: tests unitarios (rapidos, sin AWS real)",
  "integration: tests con AWS real (deployed)",
  "slow: tests > 1s",
]

[tool.coverage.run]
branch = true
source = ["core"]
omit = ["**/__init__.py", "**/tests/*", "**/core/shared/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
