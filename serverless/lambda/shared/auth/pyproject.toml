# @config: shared/auth/pyproject.toml
# @description: manifiesto de dependencias del subpaquete shared.auth
#   (portador unico de pyjwt + argon2-cffi + generador de codes/tokens).
#   Ver shared/core/pyproject.toml para el formato. NO es un paquete
#   publicable.

[project]
name = "shared-auth"
version = "0"
description = "JWT (HS256), argon2id password hashing y generadores de codes/tokens."
requires-python = ">=3.13"
dependencies = [
  "pyjwt>=2.9,<3.0",
  "argon2-cffi>=23.1,<24.0",
]

[tool.shared]
# - core: BaseModel + Field + ApplicationError + new_uuidv7
# - aws: get_secret_by_name (lee /portfolio/${stage}/jwt-secret)
# - observability: logger
internal-deps = ["core", "aws", "observability"]

# Deps de DESARROLLO del subpaquete: pytest + coverage + mocks. Permiten
# que el .venv aislado del subpaquete corra su suite. NO van al artefacto
# de deploy. La config de pytest de shared/ esta centralizada en
# serverless/lambda/shared/tests/ — este subpaquete NO declara
# [tool.pytest.ini_options].
[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "mypy>=1.10,<2.0",
  "ruff>=0.6,<1.0",
  "freezegun>=1.4,<2.0",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [".venv/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = [
  "E501",   # line-length manejado por formatter
  "ANN401", # any explicit en argumentos kwargs
  "S101",   # asserts ok en tests
  "S311",   # random no-cryptographic ok
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
