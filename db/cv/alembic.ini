# Alembic config — schema relacional del CV.
#
# La connection string NO se define aqui: env.py la resuelve en runtime
# desde la env var CV_DATABASE_URL (regla del proyecto: secretos fuera de
# archivos versionados). sqlalchemy.url queda vacio a proposito.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# version_table propio: NO colisiona con `schema_migrations` del runner SQL
# del backend serverless ni con el `alembic_version` por defecto.
version_table = cv_alembic_version

# Plantilla de nombre de archivo: NNNN ordinal + slug del mensaje.
file_template = %%(rev)s_%%(slug)s

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
