# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI necesarias.
# SSM Parameter del bypass token para Playwright E2E.
# Solo existe en `dev` — JAMAS debe propagarse a stage/prod.
kind: ssm-parameter

name: turnstile-bypass-secret
description: Bypass token para Playwright E2E (solo dev)

path: /portfolio/dev/turnstile-bypass-secret
ssm_type: SecureString
kms_key_alias: alias/portfolio-lambdas

source_env_var: TURNSTILE_BYPASS_SECRET
# Convencion get_secret_by_name: SSM_<UPPER>_PATH donde UPPER es el
# short_name completo (con guiones -> underscores). Antes era
# SSM_TURNSTILE_BYPASS_PATH (acortado), pero get_secret_by_name busca
# el path completo derivado del short_name -> SSM_TURNSTILE_BYPASS_SECRET_PATH.
target_env_var: SSM_TURNSTILE_BYPASS_SECRET_PATH

stages: [dev]
required: false

owners:
  - pacg1991@gmail.com

consumed_by:
  - contact_form

tags:
  Project: portfolio
  ManagedBy: devtools
