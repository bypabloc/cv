# @config: shared/cache/pyproject.toml
# @description: manifiesto de dependencias del subpaquete shared.cache
#   (cache DynamoDB con TTL, SWR y lock distribuido). Ver
#   shared/core/pyproject.toml para el formato. NO es un paquete publicable.

[project]
name = "shared-cache"
version = "0"
description = "Cache DynamoDB: TTL, stale-while-revalidate, lock distribuido."
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.34.0,<2.0",
]

[tool.shared]
# client.py usa el modelo CacheItem (dynamodb), el singleton Resource
# (aws) y el logger (observability).
internal-deps = ["aws", "dynamodb", "observability"]
