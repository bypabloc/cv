# ============================================================================
# RUFF DEVTOOLS - CLI tools y dev scripts (Python 3.14)
# ============================================================================
# Config completa, autocontenida. Sin extend.
# ============================================================================

line-length = 80
# Python real del proyecto: 3.14 (devtools/.venv via uv).
# Ruff con target=py314 aplica PEP 758: ``except (A, B):`` sin ``as`` se
# reformatea a ``except A, B:`` (mas conciso, válido en >= 3.14).
#
# Excepcion: archivos del bootstrap que corren ANTES del re-exec a Python
# 3.14 (devtools/run.py y .git-hooks/*.py) tienen pin a py313 via
# ``per-file-target-version`` mas abajo — Python 3.13 del shell del usuario
# lanzaria SyntaxError parseando esos archivos sin parentesis.
target-version = "py314"
indent-width = 4

src = ["."]

fix = true
show-fixes = true

namespace-packages = []

extend-include = ["*.pyi"]
respect-gitignore = true
exclude = [
    ".venv", "venv", "env", ".env",
    "__pycache__", ".cache", ".pytest_cache",
    "build", "dist", ".tox",
    ".git", ".mypy_cache", ".ruff_cache",
    "node_modules",
    "tmp",
    "*.egg-info",
]

# Bootstrap files que pueden ejecutarse en Python <3.14 ANTES del re-exec a
# devtools/.venv (Python 3.14). Si el formatter aplicara PEP 758
# (`except A, B:` sin parentesis), Python 3.13 lanzaria SyntaxError al
# parsear el archivo, antes incluso de que ensure_venv() corra. Pin a py313
# para preservar la sintaxis con parentesis y mantener el bootstrap robusto.
#
# Aplica a:
# - devtools/run.py: entry point que hace re-exec a devtools/.venv (Py 3.14)
# - .git-hooks/*.py: git invoca estos directo con el python del sistema
[per-file-target-version]
"run.py" = "py313"
".git-hooks/**/*.py" = "py313"

# ============================================================================
# REGLAS DE LINTING
# ============================================================================

[lint]
select = [
    # Estándares básicos
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings

    # Imports y modernizacion
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade

    # Python moderno
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "N",      # pep8-naming
    "FLY",    # flynt
    "FURB",   # refurb
    "RSE",    # flake8-raise

    # Type annotations
    "ANN",    # flake8-annotations

    # Seguridad y calidad
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "SLF",    # flake8-self
    "DTZ",    # flake8-datetimez

    # Performance
    "PERF",   # perflint
    "C90",    # mccabe complexity

    # Exception handling
    "TRY",    # tryceratops

    # Pylint (errores reales)
    "PLE",    # pylint-error

    # Testing
    "PT",     # flake8-pytest-style

    # Limpieza de codigo
    "ERA",    # eradicate
    "T20",    # flake8-print
    "FIX",    # flake8-fixme
    "ISC",    # flake8-implicit-str-concat

    # Logging y debug
    "G",      # flake8-logging-format
    "LOG",    # flake8-logging
    "T10",    # flake8-debugger

    # Async
    "ASYNC",  # flake8-async

    # Quotes
    "Q",      # flake8-quotes

    # Ruff
    "RUF",    # Ruff-specific rules
]

ignore = [
    # Compatibilidad con formatter
    "E501",   # Line too long - formatter handles
    "E203",   # Whitespace before ':' - formatter handles
    "COM812", # missing-trailing-comma: conflicts with formatter
    "COM819", # prohibited-trailing-comma: conflicts with COM812
    "ISC001", # implicit-string-concat: conflicts with formatter
    "Q001",   # multiline-quotes: formatter prefiere dobles

    # Type annotations (excepciones razonables)
    "ANN204", # Missing return type for __init__, etc.
    "ANN401", # Dynamically typed expressions (Any)

    # Docstrings (opcional por ahora)
    "D100", "D101", "D102", "D103", "D104",

    # CLI tools usan mensajes descriptivos en excepciones (interfaz de usuario)
    "TRY003",
]

# ============================================================================
# PER-FILE IGNORES
# ============================================================================

[lint.per-file-ignores]
# CLI tools: print() es la interfaz de usuario, imports para re-export ok
"**/*.py" = ["T20", "F401"]

# Tests genericos (heredados del base previo)
"tests/**/*.py" = [
    "T20", "S101", "S106", "S108", "S311", "PT011",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
    "SLF001", "DTZ",
]
"**/test_*.py" = [
    "T20", "S101", "S106", "S108", "S311", "PT011",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
    "SLF001", "DTZ",
]
"**/tests.py" = [
    "T20", "S101", "S106", "S108", "S311", "PT011",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
    "SLF001", "DTZ",
]
"**/conftest.py" = ["ANN001", "ANN002", "ANN003", "ANN201"]

# Tests devtools especificos: assert es esperado, fixtures via tmp_path no requieren typing
"devtools/tests/**/*.py" = [
    "S101",                         # use of `assert` is the way pytest works
    "ANN001", "ANN201", "ANN202",   # don't require type hints on test methods
    "PLR2004",                      # magic values in assertions are fine
    "INP001",                       # tests don't need __init__.py
]

# ============================================================================
# COMPLEJIDAD
# ============================================================================

[lint.mccabe]
max-complexity = 10

# ============================================================================
# ISORT
# ============================================================================

[lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
force-single-line = true
force-sort-within-sections = true
combine-as-imports = false
split-on-trailing-comma = false
force-wrap-aliases = false
single-line-exclusions = []
lines-after-imports = 2
known-first-party = [
    "scan", "docker",
    "test_runner",
]
known-third-party = ["git"]

# ============================================================================
# OTRAS CONFIGURACIONES
# ============================================================================

[lint.pycodestyle]
max-line-length = 80

[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-annotations]
suppress-dummy-args = true
allow-star-arg-any = false
suppress-none-returning = false

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"
raises-require-match-for = [
    "BaseException", "Exception", "ValueError",
    "TypeError", "KeyError", "AttributeError", "RuntimeError",
]

[lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

# ============================================================================
# FORMATTER
# ============================================================================

[format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80
line-ending = "lf"
skip-magic-trailing-comma = false
