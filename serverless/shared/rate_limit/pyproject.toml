# @config: shared/rate_limit/pyproject.toml
# @description: manifiesto de dependencias del subpaquete shared.rate_limit
#   (rate-limit per-IP sliding window weighted). Ver
#   shared/core/pyproject.toml para el formato. NO es un paquete publicable.

[project]
name = "shared-rate-limit"
version = "0"
description = "Rate-limit per-IP con DynamoDB: sliding window, auto-blacklist."
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.34.0,<2.0",
]

[tool.shared]
# rules.py usa @cached (cache) y los modelos DynamoDB; exceptions.py
# reexporta shared.core.exceptions.
internal-deps = ["core", "cache", "dynamodb"]
