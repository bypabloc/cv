# Portfolio - test compose (build + preview, sin HMR, puerto 9972).

x-app-environment: &app-environment
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  BASE_SCHEME: ${BASE_SCHEME:-http}
  BASE_PORT: ${BASE_PORT:-9972}
  # Backend serverless (vienen de docker/env/client/.test — categoria
  # client, valores publicos). Astro los lee como import.meta.env.PUBLIC_*
  # y los inlinea en el bundle del browser.
  PUBLIC_API_ENDPOINT: ${PUBLIC_API_ENDPOINT:-}
  PUBLIC_TURNSTILE_SITEKEY: ${PUBLIC_TURNSTILE_SITEKEY:-}

# Env vars del admin (Next.js). Next lee process.env.NEXT_PUBLIC_* en
# build/dev y las inlinea en el bundle del browser. Vienen de
# docker/env/client/.test (categoria client, valores publicos).
x-admin-environment: &admin-environment
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  BASE_SCHEME: ${BASE_SCHEME:-http}
  BASE_PORT: ${BASE_PORT:-9972}
  NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-}
  NEXT_PUBLIC_TURNSTILE_SITEKEY: ${NEXT_PUBLIC_TURNSTILE_SITEKEY:-}
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
  NEXT_PUBLIC_AUTH_REFRESH_LEAD_MS: ${NEXT_PUBLIC_AUTH_REFRESH_LEAD_MS:-30000}
  NEXT_PUBLIC_WEBAUTHN_RP_ID: ${NEXT_PUBLIC_WEBAUTHN_RP_ID:-}
  NEXT_PUBLIC_FEATURE_MFA: ${NEXT_PUBLIC_FEATURE_MFA:-true}
  # E2E bypass on en test (donde corre la suite Playwright contra el backend
  # dev). El spec inyecta el bypass token Ed25519 en window. Ver local.yml.
  NEXT_PUBLIC_E2E_BYPASS: ${NEXT_PUBLIC_E2E_BYPASS:-true}

services:
  # --- Backend del lambda local: Postgres + DynamoDB Local --------------
  # Mismo setup que local.yml pero con DB `portfolio_test`, suffix `-test`
  # y puertos +1 (5434, 8001) para coexistir con local.yml si hace falta.
  postgres-local:
    image: postgres:18-alpine
    container_name: portfolio-postgres-test
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_test
    ports:
      - "5438:5432"
    volumes:
      - portfolio_postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  db-migrate-local:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/db-migrate/Dockerfile
    container_name: portfolio-db-migrate-test
    depends_on:
      postgres-local:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres-local:5432/portfolio_test
    volumes:
      - ../../serverless/lambda/shared:/app/shared:ro
    restart: "no"

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: portfolio-dynamodb-test
    ports:
      - "8001:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    volumes:
      - portfolio_dynamodb_test:/home/dynamodblocal/data
    # DynamoDB Local responde 400 a GET / (solo POST firmados): un 400 =
    # servidor VIVO. `curl -sf` salia 22 ante el 400 -> unhealthy perpetuo.
    # Sin `-f`: solo falla si NO hay respuesta HTTP (conexion rechazada).
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  ddb-setup-local:
    image: amazon/aws-cli:latest
    container_name: portfolio-ddb-setup-test
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        EP=http://dynamodb-local:8000
        aws --endpoint-url $$EP dynamodb create-table \
          --table-name portfolio-cache-test \
          --attribute-definitions AttributeName=cache_key,AttributeType=S \
          --key-schema AttributeName=cache_key,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true
        aws --endpoint-url $$EP dynamodb create-table \
          --table-name portfolio-rate-limit-rules-test \
          --attribute-definitions AttributeName=rule_key,AttributeType=S AttributeName=kind,AttributeType=S \
          --key-schema AttributeName=rule_key,KeyType=HASH AttributeName=kind,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true
        aws --endpoint-url $$EP dynamodb create-table \
          --table-name portfolio-rate-limit-buckets-test \
          --attribute-definitions AttributeName=bucket_key,AttributeType=S \
          --key-schema AttributeName=bucket_key,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true
        echo "[ddb-setup-test] tablas DDB locales listas"
    restart: "no"

  # --- Apps Astro -------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx-test
    ports:
      - "${PROXY_PORT:-9972}:80"
    volumes:
      - ../nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/error-pages:/usr/share/nginx/error-pages:ro
      - ../nginx/services-page:/usr/share/nginx/services-page:ro
    depends_on:
      generic:
        condition: service_started
      hub:
        condition: service_started
      fintech:
        condition: service_started
      architect:
        condition: service_started
      leader:
        condition: service_started
      vibe:
        condition: service_started
      admin:
        condition: service_started
    restart: unless-stopped

  generic:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/generic/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-generic-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  hub:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/hub/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-hub-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  fintech:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/fintech/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-fintech-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  architect:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/architect/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-architect-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  leader:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/leader/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-leader-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  vibe:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/vibe/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-vibe-test
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  # Admin panel (Next.js SPA). Build estatico + serve out/ en el puerto 3000.
  admin:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/admin/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-admin-test
    environment: *admin-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  # Feature tests shared (Playwright). On-demand via `profile: [feature]`.
  feature:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/feature/Dockerfile
    container_name: portfolio-feature-test
    network_mode: host
    volumes:
      - ../..:/app
      - feature_node_modules:/app/tests/feature/node_modules
    depends_on:
      nginx:
        condition: service_started
    profiles:
      - feature
    restart: "no"

  # E2E unificado (Python 3.14 + playwright-python). On-demand via
  # `profile: [e2e]`. Corre contra el backend DESPLEGADO (dev|stage), NO
  # contra el stack local: `network_mode: host` (salida a internet) +
  # ~/.aws montado read-only para resolver SSM/Neon. El sentinel
  # /tmp/.e2e-ready lo crea e2e-entrypoint.sh.
  e2e:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/test/e2e/Dockerfile
    container_name: portfolio-e2e-test
    network_mode: host
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ../..:/app
      - ${HOME}/.aws:/root/.aws:ro
      - e2e_venv:/app/devtools/.venv
    profiles:
      - e2e
    restart: "no"

volumes:
  portfolio_node_modules:
  feature_node_modules:
  e2e_venv:
  portfolio_postgres_test:
  portfolio_dynamodb_test:
