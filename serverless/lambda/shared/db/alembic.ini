# Alembic config — schema unificado del portfolio.
#
# La connection string NO se define aqui: env.py la resuelve en runtime
# desde la env var DATABASE_URL (regla del proyecto: secretos fuera de
# archivos versionados). sqlalchemy.url queda vacio a proposito.

[alembic]
script_location = %(here)s/alembic
# %(here)s = serverless/lambda/shared/db/ ; ../.. = serverless/lambda/
# (contiene el paquete shared/, asi `import shared.db.models` resuelve en
# env.py).
prepend_sys_path = %(here)s/../..
path_separator = os

# Tabla de versiones estandar de Alembic. Reemplaza al `schema_migrations`
# del runner SQL viejo (que se elimina).
version_table = alembic_version

file_template = %%(rev)s_%%(slug)s

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
