# @config: src/contact_form/pyproject.toml
# @description: manifiesto de dependencias del Lambda contact_form.
#   Workspace member de serverless/. Declara SOLO las deps que el Lambda
#   importa realmente (runtime). Las deps de test son compartidas y viven
#   en el [dependency-groups] del pyproject.toml raiz de serverless/.
#   devtools resuelve este archivo + los subpaquetes de shared/ que el
#   Lambda usa para armar el zip de deploy.

[project]
name = "contact-form"
version = "0.1.0"
description = "Lambda del form de contacto: valida, rate-limit, Turnstile, SES."
requires-python = ">=3.13"

# boto3 viene preinstalado en el runtime de AWS Lambda; se pinnea para que
# dev local + tests usen la misma version que cloud.
dependencies = [
  "aws-lambda-powertools[all]>=3.0.0,<4.0",
  "httpx>=0.27.0,<1.0",
  "pydantic[email]>=2.5,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "boto3>=1.34.0,<2.0",
]

[tool.uv]
package = false
