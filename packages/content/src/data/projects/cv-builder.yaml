caseStudy:
  es: >-
    Problema: necesitaba una plataforma propia para crear y publicar CVs multilenguaje sin depender
    de herramientas cerradas. Solucion: monorepo full stack con landing Astro, webapp Nuxt 4 SPA y
    backend Django 6 + DRF; editor asistido por IA multi-proveedor, auth email-first con MFA y
    passkeys, y URLs publicas /cv/<slug>/<lang>. Impacto: plataforma activa que centraliza la edicion
    de CVs con asistencia de IA y publicacion directa por URL.
  en: >-
    Problem: I needed my own platform to create and publish multilingual CVs without relying on
    closed tools. Solution: a full stack monorepo with an Astro landing, a Nuxt 4 SPA webapp and a
    Django 6 + DRF backend; a multi-provider AI-assisted editor, email-first auth with MFA and
    passkeys, and public /cv/<slug>/<lang> URLs. Impact: an active platform that centralizes
    AI-assisted CV editing and direct URL publishing.
