responsibilities:
  es:
    - >-
      Liderazgo del equipo de desarrollo del proyecto, coordinando la distribución de tareas y el
      seguimiento del avance hasta su entrega.
    - >-
      Definición de la arquitectura de la solución y de las decisiones técnicas clave del sistema de
      gestión de obras.
    - >-
      Diseño de una arquitectura de red con una PC como servidor central, habilitando el acceso
      compartido a los datos del proyecto.
    - >-
      Desarrollo e implementación del sistema informático para la gestión de obras, presupuestos y
      seguimiento de avances.
    - >-
      Elaboración de la documentación técnica del proyecto de grado, justificando cada decisión de
      diseño e implementación.
    - >-
      Planificación de los hitos del proyecto y gestión de los riesgos técnicos para cumplir con los
      plazos académicos.
  en:
    - >-
      Led the project development team, coordinating task distribution and progress tracking
      through to delivery.
    - >-
      Defined the solution architecture and the key technical decisions for the construction-site
      management system.
    - >-
      Designed a network architecture using a PC as a central server, enabling shared access to the
      project data.
    - >-
      Built and deployed the software system for managing construction sites, budgets and progress
      tracking.
    - >-
      Produced the technical documentation for the thesis project, justifying each design and
      implementation decision.
    - >-
      Planned project milestones and managed technical risks to meet the academic deadlines.
achievements:
  es:
    - >-
      Coordiné un equipo pequeño de aproximadamente tres personas, llevando el proyecto de grado a
      una entrega exitosa dentro del plazo previsto.
    - >-
      Diseñé e implementé una arquitectura cliente-servidor sobre red local que centralizó los datos
      y eliminó las copias de información desincronizadas.
    - >-
      Reduje el tiempo de consolidación de presupuestos y avances de obra de jornadas de trabajo
      manual a reportes generados directamente desde el sistema.
    - >-
      Documenté la arquitectura completa de la solución, dejando una base técnica clara para su
      defensa y eventual mantenimiento.
  en:
    - >-
      Coordinated a small team of about three people, taking the thesis project to a successful
      delivery within the planned timeframe.
    - >-
      Designed and implemented a client-server architecture over a local network that centralized
      data and removed out-of-sync information copies.
    - >-
      Cut budget and site-progress consolidation from days of manual work to reports generated
      directly from the system.
    - >-
      Documented the full solution architecture, leaving a clear technical foundation for its
      defense and eventual maintenance.
