# @config: shared/crypto/pyproject.toml
# @description: manifiesto de dependencias del subpaquete shared.crypto.
#   Portador unico de `cryptography` (firma/verificacion Ed25519 del token
#   de bypass de Turnstile). Solo lo vendorizan los Lambdas que importan
#   shared.crypto (contact_form + auth) — NO tracking_pixel ni cv.
#   Ver shared/core/pyproject.toml para el formato. NO es publicable.

[project]
name = "shared-crypto"
version = "0"
description = "Cripto compartida: firma/verificacion Ed25519 del bypass token."
requires-python = ">=3.13"
dependencies = [
  "cryptography>=44,<46",
]

[tool.shared]
# bypass_token + captcha -> core.exceptions + observability.logger.
internal-deps = ["core", "observability"]

# Deps de DESARROLLO del subpaquete: pytest + coverage + mocks. Permiten
# que el .venv aislado del subpaquete corra su suite. NO van al artefacto
# de deploy. La config de pytest de shared/ esta centralizada en
# serverless/lambda/shared/tests/ — este subpaquete NO declara
# [tool.pytest.ini_options].
[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "mypy>=1.10,<2.0",
  "ruff>=0.6,<1.0",
  "freezegun>=1.4,<2.0",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [".venv/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = [
  "E501",   # line-length manejado por formatter
  "ANN401", # any explicit en argumentos kwargs
  "S101",   # asserts ok en tests
  "S311",   # random no-cryptographic ok
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
