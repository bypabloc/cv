# @config: src/db/pyproject.toml
# @description: manifiesto de dependencias del Lambda db (gestion del
#   schema PostgreSQL via Alembic). Workspace member de serverless/.
#   Ver src/contact_form/pyproject.toml para el formato.

[project]
name = "db"
version = "0.1.0"
description = "Lambda de gestion del schema PostgreSQL del portfolio (Alembic)."
requires-python = ">=3.13"

# Corre Alembic dentro de AWS: SQLAlchemy (ORM, metadata) + alembic +
# psycopg (driver). pydantic valida el payload de los comandos.
dependencies = [
  "aws-lambda-powertools[all]>=3.0.0,<4.0",
  "boto3>=1.34.0,<2.0",
  "pydantic>=2.5,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
]

[tool.uv]
package = false
