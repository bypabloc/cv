caseStudyDetailed:
  problem:
    es: >-
      Arrancar un proyecto full stack nuevo significaba repetir cada vez la misma configuracion:
      estructura del harness de Claude Code, quality gates, convenciones de codigo, tooling y
      backend serverless. Sin un punto de partida estandar, cada repo divergia y el setup consumia
      tiempo antes de escribir la primera linea de producto.
    en: >-
      Bootstrapping a new full stack project meant repeating the same setup every time: the Claude
      Code harness structure, quality gates, code conventions, tooling and serverless backend.
      Without a standard starting point, each repo diverged and setup consumed time before writing
      the first line of product code.
  process:
    es: >-
      Construi un portfolio publico que es a la vez template: 6 apps Astro 6, backend serverless
      en AWS (Lambdas Python, DynamoDB, Neon, SES, Turnstile) provisionado con devtools y AWS CLI,
      harness Claude Code con skills/rules/hooks, quality gates en pre-commit y pre-push y un CLI
      de devtools en Python 3.14 con uv. Biome v2 unifica lint y formato. Es el mismo patron que
      adopte al introducir Claude Code en el equipo de Destacame.
    en: >-
      I built a public portfolio that doubles as a template: 6 Astro 6 apps, AWS serverless backend
      (Python Lambdas, DynamoDB, Neon, SES, Turnstile) provisioned with devtools and AWS CLI, a
      Claude Code harness with skills/rules/hooks, quality gates in pre-commit and pre-push and a
      Python 3.14 devtools CLI with uv. Biome v2 unifies linting and formatting. It is the same
      pattern I adopted when rolling out Claude Code on the Destacame team.
  result:
    es: >-
      Template reutilizable que reduce el setup de un proyecto full stack nuevo a clonar y adaptar,
      con el harness de Claude Code, los quality gates y el backend serverless ya configurados.
      Sirvio de referencia para el rollout de Claude Code en Destacame y estandariza el flujo de
      trabajo entre proyectos.
    en: >-
      A reusable template that reduces the setup of a new full stack project to cloning and
      adapting, with the Claude Code harness, the quality gates and the serverless backend already
      configured. It served as the reference for the Claude Code rollout at Destacame and
      standardizes the workflow across projects.
