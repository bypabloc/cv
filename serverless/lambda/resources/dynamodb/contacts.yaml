AWSTemplateFormatVersion: '2010-09-09'

# ============================================================================
# Stack autonomo — DynamoDB: ContactsTable (form de contacto)
# ============================================================================
# Stack CloudFormation completo e independiente. Se deploya con
# `serverless deploy-resource --name=dynamodb/contacts --stage=<stage>`.
# Nombre del stack: portfolio-dynamodb-contacts-<stage>.
# Publica sus identificadores como SSM Parameters bajo
# /portfolio/{stage}/dynamodb/contacts/{atributo} — los Lambdas los leen
# en runtime (NO via Fn::ImportValue), lo que permite redeployar este
# stack sin bloquear los stacks de los Lambdas.
# ============================================================================

Description: >
  Portfolio backend — DynamoDB ContactsTable (form de contacto). Stack
  autonomo; publica name, arn y stream-arn en SSM Parameter Store.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - stage
      - prod
    Description: Ambiente del stack (dev | stage | prod).

Resources:
  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-contacts-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: portfolio
        - Key: ManagedBy
          Value: SAM
        - Key: Stage
          Value: !Ref Stage

  # SSM Parameters: reemplazan los Outputs con Export. Los Lambdas resuelven
  # estos paths en el cold start via boto3 (ssm:GetParameter scoped).
  ContactsTableNameParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /portfolio/${Stage}/dynamodb/contacts/name
      Type: String
      Value: !Ref ContactsTable
      Description: Nombre fisico de la tabla ContactsTable.

  ContactsTableArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /portfolio/${Stage}/dynamodb/contacts/arn
      Type: String
      Value: !GetAtt ContactsTable.Arn
      Description: ARN de la tabla ContactsTable.

  ContactsTableStreamArnParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /portfolio/${Stage}/dynamodb/contacts/stream-arn
      Type: String
      Value: !GetAtt ContactsTable.StreamArn
      Description: ARN del DynamoDB Stream de ContactsTable.

# Outputs sin Export: referencia post-deploy / debugging. Sin Export para
# no acoplar este stack a los stacks de los Lambdas (CloudFormation prohibe
# borrar un stack cuyo Export este en uso).
Outputs:
  ContactsTableName:
    Description: Nombre fisico de la tabla ContactsTable.
    Value: !Ref ContactsTable
  ContactsTableArn:
    Description: ARN de la tabla ContactsTable.
    Value: !GetAtt ContactsTable.Arn
  ContactsStreamArn:
    Description: ARN del DynamoDB Stream de ContactsTable.
    Value: !GetAtt ContactsTable.StreamArn
