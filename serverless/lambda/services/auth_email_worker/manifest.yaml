# Manifiesto del Lambda `auth_email_worker` — fuente de verdad de su config.
#
# Worker SQS-driven: consume mensajes de la cola
# `portfolio-auth-email-${stage}` (batch_size=5, ReportBatchItemFailures)
# que el Lambda `auth` publica. Renderiza la plantilla por `kind` + locale,
# envia el email via SES y registra el evento `email.sent.<kind>` en
# `auth_audit_log`. Sigue el patron lambda-controller.
#
# devtools traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=auth_email_worker

# --- Identidad ---
name: auth-email-worker
description: Procesa mensajes SQS de la cola auth-email (SES + auth_audit_log).

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 384       # MB — SES + Neon necesitan algo de headroom
timeout: 30       # segundos — visibility_timeout=180 (6x timeout)

# --- Trigger SQS ---
# batch_size=5: SES tolera batch (envia secuenciales en una invocacion).
# 5x menos invocaciones del Lambda a cambio de latencia ~ms que NO importa
# (worker async). ReportBatchItemFailures permite fallar uno y reintentar
# solo ese.
trigger:
  type: sqs
  queue: portfolio-auth-email-${stage}
  batch_size: 5
  function_response_types:
    - ReportBatchItemFailures

# --- Recursos que usa ---
uses:
  queues:
    - name: portfolio-auth-email-${stage}
      access: consumer
  tables: {}
  secrets:
    - ses-from-address          # remitente verificado en SES
    - neon-url                  # connection string PostgreSQL (auth_audit_log)
  sends-email: true             # PR a IAM para sesv2:SendEmail

# --- Variables de entorno por stage ---
env:
  default:
    LOG_LEVEL: INFO
    AWS_SES_REGION: us-east-1
    POWERTOOLS_SERVICE_NAME: auth-email-worker
    POWERTOOLS_METRICS_NAMESPACE: Portfolio/Auth
  dev:
    LOG_LEVEL: INFO
  stage:
    LOG_LEVEL: INFO
  prod:
    LOG_LEVEL: WARNING
