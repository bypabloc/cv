# @config: lambda/services/cv/pyproject.toml
# @description: manifiesto de dependencias y tooling del Lambda cv
#   (lectura publica del CV + operations admin content/publish, ex
#   cv_admin). Lambda autonomo: tiene su propio uv.lock y .venv aislado.

[project]
name = "cv"
version = "0.1.0"
description = "Lambda del CV: lectura publica + escritura admin + publish."
requires-python = ">=3.13"

# El core/ del Lambda no declara dependencias propias: todo le llega por
# el vendoring del cierre de shared/ (shared.db aporta sqlalchemy +
# psycopg, shared.lambda_kit aporta pydantic, shared.observability aporta
# aws-lambda-powertools, shared.aws + shared.cache aportan boto3).
# Regla de dedup D-3 del plan docs/specs/serverless-lambda-independence/.
dependencies = []

# Deps de DESARROLLO: pytest + coverage + mocks.
[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "mypy>=1.10,<2.0",
  "ruff>=0.6,<1.0",
  "moto[dynamodb,ssm,kms]>=5.0,<6.0",
  "freezegun>=1.4,<2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [".venv/", "build/", "events/*.json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = [
  "E501",
  "ANN401",
  "S101",
  "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "RUF059", "S105", "S106", "S107"]
"core/handler.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: tests unitarios (rapidos, sin AWS real)",
  "integration: tests con AWS real (deployed)",
]

[tool.coverage.run]
branch = true
source = ["core"]
omit = ["**/__init__.py", "tests/*", "core/shared/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["core"]
