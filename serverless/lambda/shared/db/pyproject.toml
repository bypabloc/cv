# @config: shared/db/pyproject.toml
# @description: manifiesto de dependencias del subpaquete shared.db
#   (ORM SQLAlchemy + Alembic para Neon PostgreSQL). Ver
#   shared/core/pyproject.toml para el formato. NO es un paquete publicable.

[project]
name = "shared-db"
version = "0"
description = "ORM SQLAlchemy 2.x + Alembic del schema PostgreSQL (Neon)."
requires-python = ">=3.13"
dependencies = [
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[tool.shared]
# url.py resuelve la connection string via shared.aws.ssm.
internal-deps = ["aws"]
