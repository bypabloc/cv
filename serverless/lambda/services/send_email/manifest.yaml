# Manifiesto del Lambda `send_email` — fuente de verdad de su config.
#
# Lambda puro de envio de email: lee la config de DynamoDB (email-config),
# baja el template de S3, renderiza con Jinja2 y envia por SES. NO toca Neon.
# Lo invocan contact_form / auth / users con InvocationType='Event' (async).
#   python devtools/run.py serverless deploy --lambda=send_email

# --- Identidad ---
name: send-email
description: Envia email transaccional (DynamoDB config + S3 template + Jinja2 + SES).

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 1024      # MB — EXPERIMENTO (docs/specs/coldstart-cv-query-and-
                  # snapstart). Config uniforme 1024 para medir con CPU x4.
                  # jinja2 + boto3 (dynamodb+s3+ses), SIN Neon. Previo: 256
                  # (estimado). REVERTIR tras medir. Ver lambda-config.md.
timeout: 60       # segundos — colchon uniforme (render Jinja2 + SES).

# SnapStart: precalienta imports en el INIT -> snapshot. Habilitado.
snap_start: true

# --- Trigger: invoke directo async (sin HTTP) ---
trigger:
  type: direct

# --- Recursos que usa ---
uses:
  tables:
    email-config: read         # mapea kind -> bucket + template paths + subject
  buckets:
    - name: portfolio-email-templates-${stage}
      access: read             # baja los templates html/txt
  secrets:
    - ses-from-address         # String: from address verificado en SES
  sends-email: true            # SES SendEmail

# --- Variables de entorno por stage ---
env:
  default:
    LOG_LEVEL: INFO
    AWS_SES_REGION: us-east-1
  prod:
    LOG_LEVEL: WARNING
