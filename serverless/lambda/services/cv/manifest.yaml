# Manifiesto del Lambda `cv` — fuente de verdad de su config.
#
# Sirve el CV (lectura) desde Neon PostgreSQL via GET /cv. devtools
# traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=cv

# --- Identidad ---
name: cv
description: Sirve el CV (lectura) desde Neon PostgreSQL via GET /cv.

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 256       # MB — minimo medido (dev, 2026-05, cold $LATEST). Read-only
                  # Neon: a 256 usa 165 MB; a 128 usa 118/128 (10 MB headroom,
                  # riesgo OOM con CV mas grande). El handler ~9s es Neon-I/O-
                  # bound (no escala con memoria). Bajo de 512 a 256. 128 NO
                  # por headroom. Ver .claude/rules/lambda-config.md.
timeout: 30       # segundos — cubre el cold sin SnapStart restore (warmup INIT)

# SnapStart: el handler precalienta engine + configure_mappers en el INIT
# (warm_db); el snapshot los captura y el restore evita el costo CPU del
# primer query. Habilitado para bajar la memoria sin penalizar el cold.
snap_start: true

# --- Trigger HTTP ---
trigger:
  type: http
  method: GET
  path: /cv

# --- Recursos que usa ---
uses:
  tables:
    cache: read-write          # @cached de las respuestas (CV cambia raramente)
  secrets:
    - neon-url                 # connection string PostgreSQL (SecureString)
  sends-email: false

# --- Variables de entorno por stage ---
env:
  default:
    LOG_LEVEL: INFO
  dev:
    CORS_ALLOWED_ORIGINS: 'https://portfolio.dev.the-full-stack.com,https://hub.portfolio.dev.the-full-stack.com,https://fintech.portfolio.dev.the-full-stack.com,https://architect.portfolio.dev.the-full-stack.com,https://leader.portfolio.dev.the-full-stack.com,https://vibe.portfolio.dev.the-full-stack.com'
  stage:
    CORS_ALLOWED_ORIGINS: 'https://portfolio.stage.the-full-stack.com,https://hub.portfolio.stage.the-full-stack.com,https://fintech.portfolio.stage.the-full-stack.com,https://architect.portfolio.stage.the-full-stack.com,https://leader.portfolio.stage.the-full-stack.com,https://vibe.portfolio.stage.the-full-stack.com'
  prod:
    LOG_LEVEL: WARNING
    CORS_ALLOWED_ORIGINS: 'https://the-full-stack.com,https://www.the-full-stack.com,https://hub.portfolio.the-full-stack.com,https://fintech.portfolio.the-full-stack.com,https://architect.portfolio.the-full-stack.com,https://leader.portfolio.the-full-stack.com,https://vibe.portfolio.the-full-stack.com'
