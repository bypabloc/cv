# Manifiesto del Lambda `cv` — fuente de verdad de su config.
#
# TODA la logica del CV en un solo Lambda (plan d-cv-consolidation):
# - operation `cv` (publica, GET /cv): lectura cacheada desde Neon.
# - operation `content` (admin, POST /cv): escritura de las entidades
#   cv_* + reorder + catalogs + get-all (CV de edicion en 1 sesion).
# - operation `publish` (admin, POST /cv): dispara/consulta el workflow
#   deploy-apps.yml via la GitHub API.
# Las operations admin exigen access JWT + whitelist SSM admin-emails
# (required_permission='admin' resuelto por la fase Authorize del kit).
#
# devtools traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=cv

# --- Identidad ---
name: cv
description: CV completo via /cv (lectura publica + escritura admin + publish).

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 1024      # MB — PISO del proyecto (.claude/rules/lambda-config.md):
                  # TODOS los lambdas declaran 1024 como minimo (memoria==CPU,
                  # decision 2026-06-10). Subir por encima requiere medicion
                  # documentada; bajar esta prohibido.
timeout: 60       # segundos — colchon uniforme (cold sin restore + query).

# SnapStart DESACTIVADO (2026-06): el storage del snapshot
# (Lambda-SnapStart-Cached-GB-S) se factura por hora por cada version
# publicada y NO entra en el free tier (~$50/mes con 25 funciones). El
# handler de cv es Neon-I/O-bound; la palanca real es la query, no el
# restore. Re-evaluar solo si lo exige. Ver .claude/rules/lambda-config.md.
snap_start: false

# --- Trigger HTTP ---
trigger:
  type: http
  methods: [GET, POST]   # GET = operation cv (publica); POST = content/publish (admin)
  path: /cv

# --- Recursos que usa ---
uses:
  # Tablas DynamoDB: cache (@cached de lecturas + invalidacion por tag
  # 'cv' tras cada escritura) + jwt-blacklist (solo lookup del jti del
  # access JWT) + rate-limit per-IP de las operations admin.
  tables:
    cache: read-write
    jwt-blacklist: read
    rate-limit-rules: read
    rate-limit-buckets: read-write
  # Secretos que el Lambda lee de SSM (solo el nombre corto).
  secrets:
    - neon-url             # connection string PostgreSQL (lectura + escritura cv_*)
    - jwt-secret           # verifica el access JWT (HS256) de las operations admin
    - admin-emails         # whitelist del scope admin (content/publish)
    - github-deploy-token  # PAT fine-grained (Actions RW en bypabloc/cv) para publish
  sends-email: false

# --- Variables de entorno por entorno ---
env:
  default:
    LOG_LEVEL: INFO
    JWT_ISSUER: portfolio-auth
    JWT_AUDIENCE: portfolio
  dev:
    CORS_ALLOWED_ORIGINS: 'https://portfolio.dev.the-full-stack.com,https://hub.portfolio.dev.the-full-stack.com,https://fintech.portfolio.dev.the-full-stack.com,https://architect.portfolio.dev.the-full-stack.com,https://leader.portfolio.dev.the-full-stack.com,https://vibe.portfolio.dev.the-full-stack.com,https://admin.portfolio.dev.the-full-stack.com'
  prod:
    LOG_LEVEL: WARNING
    CORS_ALLOWED_ORIGINS: 'https://the-full-stack.com,https://www.the-full-stack.com,https://hub.portfolio.the-full-stack.com,https://fintech.portfolio.the-full-stack.com,https://architect.portfolio.the-full-stack.com,https://leader.portfolio.the-full-stack.com,https://vibe.portfolio.the-full-stack.com,https://admin.portfolio.the-full-stack.com'
