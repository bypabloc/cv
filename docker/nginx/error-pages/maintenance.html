<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>En mantenimiento</title>
  <style>
    body {
      margin: 0; padding: 48px 24px;
      background: #0a0a0a; color: #f7f7f5;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      display: grid; place-items: center; min-height: 100vh; line-height: 1.6;
    }
    .box { max-width: 480px; text-align: center; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { color: #8a8a85; margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>En mantenimiento</h1>
    <p>El servicio esta temporalmente fuera de linea. Volvemos pronto.</p>
  </div>
</body>
</html>
