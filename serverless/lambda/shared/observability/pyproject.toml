# @config: shared/observability/pyproject.toml
# @description: manifiesto de dependencias del subpaquete
#   shared.observability (logger, metrics — Powertools v3, sin X-Ray). Ver
#   shared/core/pyproject.toml para el formato. NO es un paquete publicable.

[project]
name = "shared-observability"
version = "0"
description = "Logging y metrics con AWS Lambda Powertools v3 (sin X-Ray)."
requires-python = ">=3.13"
dependencies = [
  "aws-lambda-powertools>=3.0.0,<4.0",
]

[tool.shared]
internal-deps = []

# Deps de DESARROLLO del subpaquete: pytest + coverage + mocks. Permiten
# que el .venv aislado del subpaquete corra su suite. NO van al artefacto
# de deploy. La config de pytest de shared/ esta centralizada en
# serverless/lambda/shared/tests/ — este subpaquete NO declara
# [tool.pytest.ini_options].
[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "mypy>=1.10,<2.0",
  "ruff>=0.6,<1.0",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [".venv/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = [
  "E501",   # line-length manejado por formatter
  "ANN401", # any explicit en argumentos kwargs
  "S101",   # asserts ok en tests
  "S311",   # random no-cryptographic ok
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
