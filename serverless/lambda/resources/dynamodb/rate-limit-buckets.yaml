# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI.
# DynamoDB RateLimitBucketsTable (sliding window counters, TTL). devtools la
# provisiona con `aws dynamodb create-table` + `update-time-to-live` y
# publica name/arn en SSM.
kind: dynamodb-table
name: portfolio-rate-limit-buckets-${stage}
billing_mode: PAY_PER_REQUEST
hash_key: { name: bucket_key, type: S }
range_key: null
stream: null
point_in_time_recovery: false
encryption: true
ttl_attribute: expires_at
publishes_ssm:
  name: /portfolio/${stage}/dynamodb/rate-limit-buckets/name
  arn: /portfolio/${stage}/dynamodb/rate-limit-buckets/arn
tags: { Project: portfolio, ManagedBy: devtools }
