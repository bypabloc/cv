# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI.
# DynamoDB TrackingTable (eventos del tracking pixel, TTL 60d). devtools lo
# provisiona con `aws dynamodb create-table` + `update-time-to-live` y
# publica name/arn/stream-arn en SSM.
kind: dynamodb-table
name: portfolio-tracking-${stage}
billing_mode: PAY_PER_REQUEST
hash_key: { name: session_id, type: S }
range_key: { name: page_id, type: S }
stream: NEW_AND_OLD_IMAGES
point_in_time_recovery: true
encryption: true
ttl_attribute: expires_at
publishes_ssm:
  name: /portfolio/${stage}/dynamodb/tracking/name
  arn: /portfolio/${stage}/dynamodb/tracking/arn
  stream_arn: /portfolio/${stage}/dynamodb/tracking/stream-arn
tags: { Project: portfolio, ManagedBy: devtools }
