# Manifiesto del Lambda `contact_form` — fuente de verdad de su config.
#
# Este archivo describe el Lambda en terminos de DESARROLLADOR, no de
# infraestructura: no hay ARNs, ni politicas IAM, ni funciones intrinsecas.
# devtools traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=contact_form
#
# devtools provisiona el Lambda sin SAM ni CloudFormation: el rol IAM, el
# LogGroup, la funcion y el wiring del trigger se crean con `aws ...` y el
# estado queda en serverless/lambda/.state/ (efimero, gitignored).

# --- Identidad ---
name: contact-form
description: Encoder del form de contacto (valida + Turnstile + encola SQS).

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 256       # MB — minimo medido (dev, 2026-05, cold $LATEST tras
                  # lazy+warmup). Footprint base Neon (sqlalchemy+httpx+DDB):
                  # 117/128 a 128 MB (solo 11 MB headroom -> riesgo OOM en el
                  # submit completo) vs 157 MB a 256 (comodo). 128 NO.
                  # Bajo de 384 a 256. Ver .claude/rules/lambda-config.md.
timeout: 30       # segundos — cubre el cold sin SnapStart restore + Turnstile.

# SnapStart: reduce cold start de 3.4s a ~830ms (Restore Duration).
# Cuando true, cada deploy hace publish-version + update-alias `live`,
# y el trigger HTTP apunta al alias `:live` (no $LATEST).
# Critico para /contact: low traffic prod hace que cada submit pague
# cold start (no se mantiene warm como /track).
snap_start: true

# --- Como se invoca este Lambda ---
# http: expone un endpoint en la API del backend.
trigger:
  type: http
  method: POST
  path: /contact

# --- Que recursos del backend usa ---
# devtools traduce esto a los permisos IAM y los imports necesarios.
uses:
  # Cola SQS hacia donde el encoder publica el mensaje cuando
  # ASYNC_MODE=true. devtools concede sqs:SendMessage al rol IAM y
  # inyecta SSM_CONTACT_FORM_QUEUE_URL_PATH al runtime.
  queues:
    - name: portfolio-contact-form-${stage}
      access: producer
  # Tablas DynamoDB que el Lambda lee/escribe. Acceso: read | write | read-write
  # Spec direct-neon-writes: la tabla `contacts` ya no se usa — el Lambda
  # escribe directo a Neon (`contacts`). Solo quedan las tablas de
  # infraestructura (cache + rate-limit).
  tables:
    cache: read-write              # @cached
    rate-limit-rules: read-write   # rate-limit per-IP
    rate-limit-buckets: read-write
  # Secretos que el Lambda lee (de SSM). Solo el nombre corto.
  # NOTA: owner-email, ses-from-address y neon-url SOLO los necesita el
  # flujo sync legacy (ASYNC_MODE=false). Mientras dure el feature flag
  # se mantienen aqui para que el rollback siga funcionando; una vez que
  # el flag se deprecque, se borraran de la lista (y los permisos IAM con
  # ellos).
  secrets:
    - turnstile-secret        # validacion del captcha Cloudflare Turnstile
    - turnstile-bypass-secret # bypass de Turnstile para tests E2E (solo dev)
    - owner-email             # destinatario (solo sync legacy)
    - ses-from-address        # remitente verificado SES (solo sync legacy)
    - neon-url                # connection string Neon (solo sync legacy)
  # Envia email transaccional por SES al recibir un form (solo en sync).
  sends-email: true

# --- Variables de entorno por stage ---
# CORS_ALLOWED_ORIGINS define la whitelist de origins permitidos por
# el handler HTTP (common/cors.py) Y el set de hostnames validos del
# widget Turnstile (shared/http/turnstile._expected_hostnames). Por eso
# debe coincidir con el dominio publico de cada stage; si falta, el
# siteverify rechaza con CAPTCHA_HOSTNAME_MISMATCH (defensa contra
# widget hijacking). Misma whitelist que tracking_pixel y cv.
#
# ASYNC_MODE ('true' / 'false') decide en runtime si el Lambda actua
# como ENCODER (publica a SQS + 202, default) o SYNC LEGACY (Neon+SES+
# 201, rollback). Se evalua una vez por cold start via AppConfig; los
# rollouts/rollback se hacen flipeando este valor + redeploy.
env:
  default:
    LOG_LEVEL: INFO
    AWS_SES_REGION: us-east-1
    ASYNC_MODE: 'true'
  dev:
    LOG_LEVEL: INFO
    ASYNC_MODE: 'true'
    CORS_ALLOWED_ORIGINS: 'https://portfolio.dev.the-full-stack.com,https://hub.portfolio.dev.the-full-stack.com,https://fintech.portfolio.dev.the-full-stack.com,https://architect.portfolio.dev.the-full-stack.com,https://leader.portfolio.dev.the-full-stack.com,https://vibe.portfolio.dev.the-full-stack.com'
  stage:
    LOG_LEVEL: INFO
    ASYNC_MODE: 'true'
    CORS_ALLOWED_ORIGINS: 'https://portfolio.stage.the-full-stack.com,https://hub.portfolio.stage.the-full-stack.com,https://fintech.portfolio.stage.the-full-stack.com,https://architect.portfolio.stage.the-full-stack.com,https://leader.portfolio.stage.the-full-stack.com,https://vibe.portfolio.stage.the-full-stack.com'
  prod:
    LOG_LEVEL: WARNING
    ASYNC_MODE: 'true'
    CORS_ALLOWED_ORIGINS: 'https://the-full-stack.com,https://www.the-full-stack.com,https://hub.portfolio.the-full-stack.com,https://fintech.portfolio.the-full-stack.com,https://architect.portfolio.the-full-stack.com,https://leader.portfolio.the-full-stack.com,https://vibe.portfolio.the-full-stack.com'
