slug: cv-builder
name: CV Platform (bypabloc/cv)
summary:
  es: >-
    Plataforma web de CVs profesionales multilenguaje con editor asistido por IA y URLs publicas en
    /cv/<slug>/<lang>. Monorepo full stack: landing Astro, webapp Nuxt 4, backend Django 6.
  en: >-
    Web platform for multilingual professional CVs with an AI-assisted editor and public URLs at
    /cv/<slug>/<lang>. Full stack monorepo: Astro landing, Nuxt 4 webapp, Django 6 backend.
description:
  es: >-
    Aplicacion full stack para crear, editar y publicar CVs profesionales en varios idiomas. La
    webapp Nuxt 4 (SPA) ofrece un editor con sugerencias asistidas por IA multi-proveedor (Claude
    API y OpenAI, con API keys propias del usuario). El backend Django 6 + DRF cubre autenticacion
    email-first con JWT, MFA, passkeys y OAuth, ademas de las URLs publicas de cada CV. Construida y
    mantenida con Claude Code: la IA es herramienta, no autor.
  en: >-
    Full stack application to create, edit and publish professional CVs in multiple languages. The
    Nuxt 4 webapp (SPA) provides an editor with AI-assisted suggestions from multiple providers
    (Claude API and OpenAI, using the user's own API keys). The Django 6 + DRF backend covers
    email-first authentication with JWT, MFA, passkeys and OAuth, plus the public URLs for each CV.
    Built and maintained with Claude Code: AI is a tool, not an author.
