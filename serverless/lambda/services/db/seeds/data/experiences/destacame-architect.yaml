responsibilities:
  es:
    - >-
      Definición de la arquitectura frontend del producto bajo un modelo de microfrontends,
      estableciendo estándares y patrones compartidos entre equipos.
    - >-
      Desarrollo de productos fintech, incluyendo una plataforma para ayudar a los usuarios a saldar
      deudas en Chile y un producto de créditos por niveles en México.
    - >-
      Construcción de microservicios con Python y Django, integrando los servicios de backend con
      las aplicaciones de frontend.
    - >-
      Liderazgo técnico del equipo de optimización y, posteriormente, del equipo de plataforma,
      acompañando las decisiones de diseño y el trabajo del equipo.
    - >-
      Desarrollo de herramientas internas, como un administrador de campañas que automatizó procesos
      que antes eran manuales.
    - >-
      Incorporación de herramientas de desarrollo asistido por IA al flujo de trabajo del equipo,
      definiendo cómo usarlas de forma productiva y segura.
    - >-
      Despliegue y operación de aplicaciones y servicios sobre AWS como parte del trabajo de
      plataforma.
  en:
    - >-
      Defined the product's frontend architecture under a microfrontends model, setting shared
      standards and patterns across teams.
    - >-
      Built fintech products, including a debt settlement platform in Chile and a tiered credit
      product in Mexico.
    - >-
      Built microservices with Python and Django, integrating backend services with the frontend
      applications.
    - >-
      Provided technical leadership for the optimization team and, later, the platform team,
      guiding design decisions and the team's work.
    - >-
      Developed internal tools, such as a campaign manager that automated previously manual
      processes.
    - >-
      Brought AI-assisted development tools into the team's workflow, defining how to use them
      productively and safely.
    - >-
      Deployed and operated applications and services on AWS as part of the platform work.
achievements:
  es:
    - >-
      Definí la arquitectura de microfrontends del producto, habilitando que varios equipos
