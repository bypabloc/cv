# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI necesarias.
# SSM Parameter del display name del remitente SES (no secreto).
kind: ssm-parameter

name: ses-from-name
description: Display name del remitente en emails SES

path: /portfolio/ses-from-name
ssm_type: String

source_env_var: EMAIL_FROM_NAME
target_env_var: SSM_SES_FROM_NAME_PATH

stages: [dev, prod]
required: false

owners:
  - pacg1991@gmail.com

consumed_by:
  - contact_form

tags:
  Project: portfolio
  ManagedBy: devtools
