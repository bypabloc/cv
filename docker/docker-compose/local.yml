# Portfolio - local compose (HMR, bind mount, puerto 9970).

# Bloque de env vars reutilizable. SITE_URLS (en build time) las consume
# desde packages/app-shared/src/lib/site-urls.ts.
x-app-environment: &app-environment
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  BASE_SCHEME: ${BASE_SCHEME:-http}
  BASE_PORT: ${BASE_PORT:-9970}
  # Backend serverless (vienen de docker/env/client/.local — categoria
  # client, valores publicos). Astro los lee como import.meta.env.PUBLIC_*
  # y los inlinea en el bundle del browser.
  PUBLIC_API_ENDPOINT: ${PUBLIC_API_ENDPOINT:-}
  PUBLIC_TURNSTILE_SITEKEY: ${PUBLIC_TURNSTILE_SITEKEY:-}

# Env vars del admin (Next.js). Next lee process.env.NEXT_PUBLIC_* en
# build/dev y las inlinea en el bundle del browser. Vienen de
# docker/env/client/.local (categoria client, valores publicos).
x-admin-environment: &admin-environment
  BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
  BASE_SCHEME: ${BASE_SCHEME:-http}
  BASE_PORT: ${BASE_PORT:-9970}
  NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-}
  NEXT_PUBLIC_TURNSTILE_SITEKEY: ${NEXT_PUBLIC_TURNSTILE_SITEKEY:-}
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
  NEXT_PUBLIC_AUTH_REFRESH_LEAD_MS: ${NEXT_PUBLIC_AUTH_REFRESH_LEAD_MS:-30000}
  NEXT_PUBLIC_WEBAUTHN_RP_ID: ${NEXT_PUBLIC_WEBAUTHN_RP_ID:-}
  NEXT_PUBLIC_FEATURE_MFA: ${NEXT_PUBLIC_FEATURE_MFA:-true}
  # E2E bypass: en local SIEMPRE on. El form NO renderiza el Turnstile real
  # (auto-emite token vacio) y apiFetch manda el bypass token Ed25519 que el
  # spec inyecta en window.__E2E_BYPASS_TOKEN__. Sin token valido + backend
  # dev/stage el bypass NO surte efecto, asi que es seguro en local.
  NEXT_PUBLIC_E2E_BYPASS: ${NEXT_PUBLIC_E2E_BYPASS:-true}

services:
  # --- Backend del lambda local: Postgres + DynamoDB Local --------------
  # postgres-local: PG18 (match con Neon). Puerto 5433 en host (5432
  # interno) para evitar choque con un Postgres del sistema. Datos
  # persisten en el volume `portfolio_postgres_local`.
  postgres-local:
    image: postgres:18-alpine
    container_name: portfolio-postgres-local
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "5437:5432"
    volumes:
      - portfolio_postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # db-migrate-local: corre `alembic upgrade head` contra postgres-local
  # al startup y termina. Bind-monta shared/ para que cambios al schema
  # se apliquen sin rebuild de la imagen.
  db-migrate-local:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/db-migrate/Dockerfile
    container_name: portfolio-db-migrate-local
    depends_on:
      postgres-local:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres-local:5432/portfolio
    volumes:
      - ../../serverless/lambda/shared:/app/shared:ro
    restart: "no"

  # dynamodb-local: emula DynamoDB para cache + rate-limit. Puerto 8000.
  # `-sharedDb` hace que todos los SDK clients vean la misma DB
  # (independiente de region/credenciales). Datos persisten en el volume.
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: portfolio-dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    volumes:
      - portfolio_dynamodb_local:/home/dynamodblocal/data
    # DynamoDB Local responde 400 a GET / (solo acepta POST firmados): un
    # 400 = servidor VIVO. `curl -sf` salia 22 ante el 400 -> unhealthy
    # perpetuo (FailingStreak miles) aunque el servicio estuviera OK. Sin
    # `-f`: solo falla si NO hay respuesta HTTP (conexion rechazada).
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ddb-setup-local: crea las 3 tablas (cache + rate-limit-rules +
  # rate-limit-buckets) en dynamodb-local. Idempotente (ignora errores
  # si ya existen). Termina cuando termina la ultima `create-table`.
  ddb-setup-local:
    image: amazon/aws-cli:latest
    container_name: portfolio-ddb-setup-local
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        EP=http://dynamodb-local:8000
        aws --endpoint-url $$EP dynamodb create-table \
          --table-name portfolio-cache-local \
          --attribute-definitions AttributeName=cache_key,AttributeType=S \
          --key-schema AttributeName=cache_key,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true
        aws --endpoint-url $$EP dynamodb create-table \
          --table-name portfolio-rate-limit-rules-local \
          --attribute-definitions AttributeName=rule_key,AttributeType=S AttributeName=kind,AttributeType=S \
          --key-schema AttributeName=rule_key,KeyType=HASH AttributeName=kind,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true
        aws --endpoint-url $$EP dynamodb create-table \
          --table-name portfolio-rate-limit-buckets-local \
          --attribute-definitions AttributeName=bucket_key,AttributeType=S \
          --key-schema AttributeName=bucket_key,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST 2>/dev/null || true
        echo "[ddb-setup-local] tablas DDB locales listas"
    restart: "no"

  # --- Apps Astro -------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: portfolio-nginx-local
    ports:
      - "${PROXY_PORT:-9970}:80"
    volumes:
      - ../nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/error-pages:/usr/share/nginx/error-pages:ro
      - ../nginx/services-page:/usr/share/nginx/services-page:ro
    depends_on:
      generic:
        condition: service_started
      hub:
        condition: service_started
      fintech:
        condition: service_started
      architect:
        condition: service_started
      leader:
        condition: service_started
      vibe:
        condition: service_started
      admin:
        condition: service_started
    restart: unless-stopped

  generic:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/generic/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-generic-local
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  hub:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/hub/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-hub-local
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  fintech:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/fintech/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-fintech-local
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  architect:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/architect/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-architect-local
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  leader:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/leader/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-leader-local
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  vibe:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/vibe/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-vibe-local
    environment: *app-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  # Admin panel (Next.js SPA). Dev server (HMR) en el puerto 3000.
  admin:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/admin/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: portfolio-admin-local
    environment: *admin-environment
    volumes:
      - ../..:/app
      - portfolio_node_modules:/app/node_modules
    restart: unless-stopped

  # Feature tests shared (Playwright). On-demand via `profile: [feature]`.
  feature:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/local/feature/Dockerfile
    container_name: portfolio-feature-local
    network_mode: host
    volumes:
      - ../..:/app
      - feature_node_modules:/app/tests/feature/node_modules
    depends_on:
      nginx:
        condition: service_started
    profiles:
      - feature
    restart: "no"

volumes:
  portfolio_node_modules:
  feature_node_modules:
  portfolio_postgres_local:
  portfolio_dynamodb_local:
