# Esquema devtools — NO CloudFormation: esquema plano, sin funciones
# intrinsecas. devtools lo lee y emite las llamadas AWS CLI necesarias.
# SSM Parameter de la clave PUBLICA Ed25519 del bypass de Turnstile.
# Solo existe en dev — JAMAS en prod (prod NUNCA acepta bypass).
# NO es secreta: es la clave PUBLICA (String plano, sin KMS). La PRIVADA
# que firma los tokens vive en docker/env/dev-cli/ (LOCAL-ONLY), NUNCA aca.
kind: ssm-parameter

name: turnstile-bypass-public-key
description: Clave PUBLICA Ed25519 para verificar el bypass token (dev)

path: /portfolio/${stage}/turnstile-bypass-public-key
ssm_type: String

# Mapeo .env -> Lambda.
# source_env_var: KEY en docker/env/server/.{env} (la escribe `bypass_token
#   keygen`).
# target_env_var: env var del Lambda. get_parameter_by_name busca el path
#   completo derivado del short_name -> SSM_TURNSTILE_BYPASS_PUBLIC_KEY_PATH.
source_env_var: TURNSTILE_BYPASS_PUBLIC_KEY
target_env_var: SSM_TURNSTILE_BYPASS_PUBLIC_KEY_PATH

stages: [dev]
required: false

owners:
  - pacg1991@gmail.com

consumed_by:
  - contact_form
  - auth

tags:
  Project: portfolio
  ManagedBy: devtools
