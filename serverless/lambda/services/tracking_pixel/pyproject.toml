# @config: src/tracking_pixel/pyproject.toml
# @description: manifiesto de dependencias del Lambda tracking_pixel.
#   Workspace member de serverless/. Ver src/contact_form/pyproject.toml
#   para el formato. Las deps de test viven en el pyproject.toml raiz.

[project]
name = "tracking-pixel"
version = "0.1.0"
description = "Lambda del tracking pixel: registra eventos de pagina en DynamoDB."
requires-python = ">=3.13"

# El core/ del Lambda no declara dependencias propias: todo le llega por
# el vendoring del cierre de shared/ (shared.lambda_kit aporta pydantic;
# shared.observability aporta aws-lambda-powertools; shared.aws +
# shared.rate_limit + shared.cache aportan boto3) — ver la regla de dedup
# D-3 del plan docs/specs/serverless-lambda-independence/.
dependencies = []

[tool.uv]
package = false
