# Manifiesto del Lambda `contact_form` — fuente de verdad de su config.
#
# Este archivo describe el Lambda en terminos de DESARROLLADOR, no de
# infraestructura: no hay ARNs, ni politicas IAM, ni funciones intrinsecas.
# devtools traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=contact_form
#
# devtools provisiona el Lambda sin SAM ni CloudFormation: el rol IAM, el
# LogGroup, la funcion y el wiring del trigger se crean con `aws ...` y el
# estado queda en serverless/lambda/.state/ (efimero, gitignored).

# --- Identidad ---
name: contact-form
description: Form de contacto (valida + Turnstile + escribe Neon inline + invoke send_email).

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 1024      # MB — EXPERIMENTO de config 1024 (ver .claude/rules/lambda-config.md). Config uniforme 1024 para medir warm/cold con
                  # CPU x4. Minimo medido previo: 256 (footprint Neon 157 MB;
                  # 128 NO por headroom). REVERTIR al minimo tras medir si la
                  # mejora no lo justifica. Ver .claude/rules/lambda-config.md.
timeout: 60       # segundos — colchon uniforme (cold sin restore + Turnstile).

# SnapStart DESACTIVADO (2026-06): el storage del snapshot
# (Lambda-SnapStart-Cached-GB-S) se factura por hora por cada version
# publicada y NO entra en el free tier (~$50/mes con 25 funciones). El
# cold start lo mitiga la carga lazy de shared. Re-evaluar solo si la
# latencia de /contact lo exige. Ver .claude/rules/lambda-config.md.
snap_start: false

# --- Como se invoca este Lambda ---
# http: expone un endpoint en la API del backend.
trigger:
  type: http
  method: POST
  path: /contact

# --- Que recursos del backend usa ---
# devtools traduce esto a los permisos IAM y los imports necesarios.
uses:
  # Lambdas que invoca async (InvocationType='Event', fire-and-forget).
  # devtools concede lambda:InvokeFunction al rol IAM e inyecta
  # LAMBDA_SEND_EMAIL_FUNCTION_NAME al runtime. Reemplaza la cola SQS:
  # el contacto se escribe a Neon INLINE en el request y el email al
  # owner se delega a send_email (best-effort, no bloquea el 201).
  invokes:
    - send_email
  # Tablas DynamoDB que el Lambda lee/escribe. Acceso: read | write | read-write
  # El Lambda escribe el contacto directo a Neon (`contacts`); en DynamoDB
  # solo quedan las tablas de infraestructura (cache + rate-limit).
  tables:
    cache: read-write              # @cached
    rate-limit-rules: read-write   # rate-limit per-IP
    rate-limit-buckets: read-write
  # Params SSM que el Lambda lee en runtime (String o SecureString; el
  # catalogo resources/secrets/*.yaml define el tipo). El IAM concede
  # ssm:GetParameter sobre cada path.
  secrets:
    - turnstile-secret             # validacion del captcha Cloudflare Turnstile
    - turnstile-bypass-public-key  # clave PUBLICA Ed25519 (String) para
                                   # verificar el token de bypass de tests
                                   # E2E (solo dev/stage; la PRIVADA es local)
    - owner-email                  # destinatario del email al owner (recipients)
    - neon-url                     # connection string Neon (escritura inline)
  # El email transaccional ya NO lo manda este Lambda: lo delega a
  # send_email via invoke async. Por eso sends-email: false (sin permiso SES).
  sends-email: false

# --- Variables de entorno por stage ---
# CORS_ALLOWED_ORIGINS define la whitelist de origins permitidos por
# el handler HTTP (common/cors.py) Y el set de hostnames validos del
# widget Turnstile (shared/http/turnstile._expected_hostnames). Por eso
# debe coincidir con el dominio publico de cada stage; si falta, el
# siteverify rechaza con CAPTCHA_HOSTNAME_MISMATCH (defensa contra
# widget hijacking). Misma whitelist que tracking_pixel y cv.
#
# El Lambda escribe el contacto a Neon INLINE en el request (HTTP 201) y
# delega el email al owner a send_email via invoke async. Sin SQS, sin
# ASYNC_MODE: el flujo es uno solo. AWS_SES_REGION ya no aplica (no manda
# SES). El nombre de send_email lo inyecta devtools como
# LAMBDA_SEND_EMAIL_FUNCTION_NAME (derivado de uses.invokes).
env:
  default:
    LOG_LEVEL: INFO
  dev:
    LOG_LEVEL: INFO
    CORS_ALLOWED_ORIGINS: 'https://portfolio.dev.the-full-stack.com,https://hub.portfolio.dev.the-full-stack.com,https://fintech.portfolio.dev.the-full-stack.com,https://architect.portfolio.dev.the-full-stack.com,https://leader.portfolio.dev.the-full-stack.com,https://vibe.portfolio.dev.the-full-stack.com'
  stage:
    LOG_LEVEL: INFO
    CORS_ALLOWED_ORIGINS: 'https://portfolio.stage.the-full-stack.com,https://hub.portfolio.stage.the-full-stack.com,https://fintech.portfolio.stage.the-full-stack.com,https://architect.portfolio.stage.the-full-stack.com,https://leader.portfolio.stage.the-full-stack.com,https://vibe.portfolio.stage.the-full-stack.com'
  prod:
    LOG_LEVEL: WARNING
    CORS_ALLOWED_ORIGINS: 'https://the-full-stack.com,https://www.the-full-stack.com,https://hub.portfolio.the-full-stack.com,https://fintech.portfolio.the-full-stack.com,https://architect.portfolio.the-full-stack.com,https://leader.portfolio.the-full-stack.com,https://vibe.portfolio.the-full-stack.com'
