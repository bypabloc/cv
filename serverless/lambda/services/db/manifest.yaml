# Manifiesto del Lambda `db` — fuente de verdad de su config.
#
# Este archivo describe el Lambda en terminos de DESARROLLADOR, no de
# infraestructura: no hay ARNs, ni politicas IAM, ni funciones intrinsecas.
# devtools traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=db
#
# devtools provisiona el Lambda sin SAM ni CloudFormation: el rol IAM, el
# LogGroup, la funcion y el wiring del trigger se crean con `aws ...` y el
# estado queda en serverless/lambda/.state/ (efimero, gitignored).

# --- Identidad ---
name: db
description: Gestiona el schema PostgreSQL del portfolio (migraciones Alembic).

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 1024      # MB — PISO del proyecto (.claude/rules/lambda-config.md):
                  # TODOS los lambdas declaran 1024 como minimo (memoria==CPU,
                  # decision 2026-06-10). Subir por encima requiere medicion
                  # documentada; bajar esta prohibido.
timeout: 60       # segundos — colchon uniforme. NOTA: si una migracion grande
                  # tardara >60s, subir SOLO este. Ver lambda-config.md.

# SnapStart DESACTIVADO (2026-06): el storage del snapshot
# (Lambda-SnapStart-Cached-GB-S) se factura por hora por cada version
# publicada y NO entra en el free tier (~$50/mes con 25 funciones). El
# Lambda db corre migraciones esporadicas (no interactivo); el cold extra
# es irrelevante. Ver .claude/rules/lambda-config.md.
snap_start: false

# --- Como se invoca este Lambda ---
# direct  : se invoca directo (aws lambda invoke / deploy hook). Sin HTTP.
# http    : expone un endpoint en la API del backend.
# on-table-changes : reacciona a cambios en tablas DynamoDB.
trigger:
  type: direct

# --- Que recursos del backend usa ---
# devtools traduce esto a los permisos IAM y los imports necesarios.
uses:
  # Tablas DynamoDB que el Lambda lee/escribe. El Lambda db no usa.
  tables: []
  # Bucket de backups: el command `seed` (restore) baja el snapshot YAML
  # seed-compatible (latest/ o history/<fecha>/) que escribe db_export.
  buckets:
    - name: portfolio-db-backups-${stage}
      access: read
  # Secretos que el Lambda lee (de SSM). Solo el nombre corto: devtools
  # resuelve el path completo y el permiso de descifrado.
  secrets:
    - neon-url
  # true si el Lambda envia email (SES).
  sends-email: false

# --- Variables de entorno por entorno ---
# 'default' aplica a todos; un entorno especifico sobrescribe esas claves.
env:
  default:
    LOG_LEVEL: INFO
  prod:
    LOG_LEVEL: WARNING
