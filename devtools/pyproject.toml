[project]
name = "portfolio-devtools"
version = "0.1.0"
description = "Tooling scripts for portfolio (orchestrator: scan, docker, test_runner, hooks, verify, upgrade_deps, init)"
requires-python = "==3.14.*"
readme = "README.md"

# Devtools dependencies (PEP 621). All wheels are py3-none-any and support
# Python 3.14 (validated against PyPI metadata: requires-python ranges from
# >=3.7 to >=3.10 across all five packages).
dependencies = [
    # Linter and formatter (also installed in server containers as a dev
    # dependency; kept here so devtools/.venv has it for editor integrations
    # and host-side checks that don't need Docker)
    "ruff>=0.15.12",
    # Git history inspection (used by scan/, hooks/, upgrade_deps/)
    "GitPython>=3.1.49",
    # Async HTTP client (used by upgrade_deps/ to query PyPI and npm registries)
    "httpx>=0.28.1",
    # Test runner for devtools/tests/
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6",
    # AWS SDK (used by serverless/state.py S3StateBackend when
    # DEVTOOLS_STATE_BACKEND=s3 — the CI path)
    "boto3>=1.35.0",
    # Headless browser automation. Used by ai_audit/ to scrape AI readiness
    # tools AND by the e2e/ command (tests/shared/browser.py) to drive the
    # deployed admin + Astro apps with playwright-python. Chromium/WebKit
    # downloaded on first run via `playwright install`; in the `e2e` Docker
    # container the official playwright image preinstalls them.
    "playwright>=1.49.0",
    # HTML parser (used by ai_audit/tools/ to parse scraped DOM)
    "beautifulsoup4>=4.13.0",
    # PostgreSQL driver. Used by the e2e/ command (tests/shared/db.py) to seed
    # code/token hashes in the deployed Neon dev/stage DB for the auth verify
    # flow + cleanup of synthetic data.
    "psycopg[binary]>=3.2.0",
    # Ed25519 sign/verify. Used by bypass_token/ keygen + the e2e/ command
    # (tests/shared/secrets.py) to mint the signed Turnstile bypass token;
    # mirrors shared.crypto on the backend.
    "cryptography>=44,<46",
    # WebAuthn software authenticator: firma ceremonies (register/login) en los
    # E2E de API del checklist multi-factor (tests/), para verificar el flujo
    # passkey de forma DETERMINISTA sin el Virtual Authenticator del browser
    # (CDP es flaky). Solo en tests, mismo authenticator que usa el backend.
    "soft-webauthn>=0.1.4,<0.2.0",
]

[tool.uv]
package = false  # devtools is an application/script collection, not a library
