slug: faststruct
name: FastStruct
summary:
  es: >-
    Extensión de VS Code para visualizar y documentar la estructura de un proyecto en segundos,
    optimizando workflows con IA.
  en: >-
    VS Code extension that visualizes and documents a project structure in seconds, optimized for AI
    workflows.
description:
  es: >-
    Genera documentación clara y bien formateada de la estructura de directorios e incluye contenido
    de archivos cuando sea necesario. Nació antes de Claude Code para pasarle contexto estructural a
    la interfaz web de Claude sin copiar manualmente.
  en: >-
    Generates clear, well-formatted documentation of a directory tree, optionally including file
    contents. Born before Claude Code to feed structural context to the Claude web interface without
    copy-pasting.
url: https://marketplace.visualstudio.com/items?itemName=the-full-stack.faststruct
repo: https://github.com/bypabloc/faststruct
status: active
niches:
  - vibe
  - architect
  - generic
priority:
  architect: 70
  vibe: 100
  generic: 80
stack:
  - TypeScript
  - VS Code Extension API
  - Node.js
caseStudy:
  es: >-
    Problema: pasarle estructura de proyecto a Claude/ChatGPT requería pegar manualmente cada path.
    Solución: extensión que genera markdown estructurado con un click. Impacto: workflow personal 5x
    más rápido al instruir IAs.
  en: >-
    Problem: feeding project structure to Claude/ChatGPT meant pasting each path manually. Solution:
    an extension that produces structured markdown in one click. Impact: 5x faster personal workflow
    when instructing AIs.
metrics:
  speedup: 5x faster context handoff
  adoption: Marketplace published
  precursor: Pre-Claude-Code era (< May 2025)
caseStudyDetailed:
  problem:
    es: >-
      Antes de Claude Code (mayo 2025) usaba la interfaz web de Claude para programar. Pasarle el
      contexto de un proyecto significaba copiar archivo por archivo manualmente.
    en: >-
      Before Claude Code (May 2025) I used the Claude web interface to code. Sharing project context
      meant copy-pasting file by file manually.
  process:
    es: >-
      Construí FastStruct como extensión VS Code en TypeScript: comando único que escanea workspace,
      respeta .gitignore, formatea en markdown estructurado y copia al portapapeles. Patrones de
      exclusión configurables.
    en: >-
      I built FastStruct as a TypeScript VS Code extension: single command that scans the workspace,
      honors .gitignore, formats structured markdown and copies to clipboard. Configurable exclusion
      patterns.
  result:
    es: >-
      Workflow personal 5x más rápido para instruir IAs. Publicada en Marketplace, sigue siendo útil
      incluso ahora con Claude Code para casos donde necesito contexto compacto para sub-agentes o
      resumenes externos.
    en: >-
      5x faster personal workflow when instructing AIs. Published in the Marketplace, still useful
      even now with Claude Code for cases where I need compact context for sub-agents or external
      summaries.
