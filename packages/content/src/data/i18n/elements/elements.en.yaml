# @i18n elements.en
# Reusable UI labels in English. Identical for all 6 apps.
# Validated by ElementsStringsSchema. Its pair is elements.es.yaml — both
# files MUST have exactly the same keys (parity test).

# Navigation menu items. `key` is stable; `label` is the visible text.
# The href is built in code (depends on locale and basePrefix).
nav:
  - key: experience
    label: "Experience"
  - key: projects
    label: "Projects"
  - key: skills
    label: "Skills"
  - key: about
    label: "About"
  - key: certificates
    label: "Certificates"
  - key: contact
    label: "Contact"
  - key: hub
    label: "Other views"

