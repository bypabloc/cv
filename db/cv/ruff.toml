# ============================================================================
# RUFF db/cv — schema relacional del CV (Python 3.14)
# ============================================================================
# Config autocontenida, sin extend. Alineada con devtools/ruff.toml.
# ============================================================================

line-length = 80
target-version = "py314"
indent-width = 4
src = ["."]

fix = true
show-fixes = true

extend-include = ["*.pyi"]
respect-gitignore = true
exclude = [
    ".venv", "venv", "env", ".env",
    "__pycache__", ".cache", ".pytest_cache",
    "build", "dist", ".tox",
    ".git", ".mypy_cache", ".ruff_cache",
    "node_modules", "tmp", "*.egg-info",
    # Alembic genera el scaffolding env.py/script.py.mako con su propio estilo
    "alembic/versions",
]

[lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "PIE", "RET", "N", "FLY",
    "FURB", "RSE", "ANN", "S", "BLE", "A", "COM", "SLF", "DTZ", "PERF",
    "C90", "TRY", "PLE", "PT", "ERA", "T20", "FIX", "ISC", "G", "LOG",
    "T10", "ASYNC", "Q", "RUF",
]

ignore = [
    # Compatibilidad con formatter
    "E501", "E203", "COM812", "COM819", "ISC001", "Q001",
    # Type annotations (excepciones razonables)
    "ANN204", "ANN401",
    # Docstrings opcionales por ahora
    "D100", "D101", "D102", "D103", "D104",
    # Mensajes descriptivos en excepciones (interfaz CLI del seed)
    "TRY003",
]

[lint.per-file-ignores]
# El seed es una CLI: print() es la interfaz; imports de re-export ok
"**/*.py" = ["T20", "F401"]
# Tests: assert es el mecanismo de pytest, no se exige typing en metodos
"tests/**/*.py" = [
    "S101", "S106", "S108", "S311", "PT011",
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202",
    "SLF001", "DTZ", "PLR2004", "INP001",
]
"**/conftest.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "INP001"]
# Alembic env.py recibe config global y usa nombres de su API
"alembic/env.py" = ["INP001"]

[lint.mccabe]
max-complexity = 10

[lint.isort]
section-order = [
    "future", "standard-library", "third-party", "first-party",
    "local-folder",
]
force-single-line = true
force-sort-within-sections = true
combine-as-imports = false
split-on-trailing-comma = false
lines-after-imports = 2
known-first-party = ["models"]

[lint.pycodestyle]
max-line-length = 80

[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-annotations]
suppress-dummy-args = true
allow-star-arg-any = false
suppress-none-returning = false

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 80
line-ending = "lf"
skip-magic-trailing-comma = false
