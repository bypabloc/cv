[project]
name = "portfolio-serverless"
version = "0.1.0"
description = "Backend serverless del portfolio: Lambdas + DynamoDB + SES + Neon"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Pablo Contreras" }]

# Union de las dependencias runtime de las 4 Lambdas. Cada Lambda declara su
# subconjunto en src/<lambda>/requirements.txt (SAM las empaqueta en el zip —
# sin Lambda Layers). Aqui se pinnean para que dev local + tests usen la
# misma version que cloud.
dependencies = [
  "aws-lambda-powertools[all]>=3.0.0,<4.0",
  "httpx>=0.27.0,<1.0",
  "pydantic[email]>=2.5,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "boto3>=1.34.0,<2.0",
  # psycopg: driver. SQLAlchemy: ORM (modelos de shared/db, unica fuente
  # de verdad del schema). Los usan las Lambdas stream_processor y db.
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  # Alembic: migraciones del schema — solo lo usa la Lambda db.
  "alembic>=1.13,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "pytest-mock>=3.12,<4.0",
  "moto[dynamodb,ses,sns,sqs,ssm,kms,events]>=5.0,<6.0",
  "responses>=0.25,<1.0",
  "freezegun>=1.4,<2.0",
  "hypothesis>=6.100,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "boto3-stubs[essential,ses,sns,ssm,kms,events,sqs,logs]>=1.34,<2.0",
  "cfn-lint>=1.10,<2.0",
  "respx>=0.23.1",
]

[tool.ruff]
line-length = 80
target-version = "py313"
extend-exclude = [".aws-sam/", ".venv/", "events/*.json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "PIE", "SIM", "UP", "ANN", "S", "RUF"]
ignore = [
  "E501",   # line-length manejado por formatter
  "ANN401", # any explicit en argumentos kwargs
  "S101",   # asserts ok en tests
  "S311",   # random no-cryptographic ok
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "unit: tests unitarios (rapidos, sin AWS real)",
  "integration: tests con AWS real (deployed o sam local)",
  "slow: tests > 1s",
]

[tool.coverage.run]
branch = true
source = ["src", "shared"]
omit = ["**/__init__.py", "**/tests/*", "src/layers/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src/", "shared/", "tests/"]
# Alembic env.py + migraciones: scripts de config con la API dinamica de
# Alembic (op.*, callbacks con Literal). No es codigo de aplicacion.
exclude = ["shared/db/alembic/.*", "\\.aws-sam/.*"]
