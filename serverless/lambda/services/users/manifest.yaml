# Manifiesto del Lambda `users` — fuente de verdad de su config.
#
# HTTP encoder del dominio gestion de usuarios (plan 03): profile (CRUD
# del perfil propio), status (estado + sesiones activas) y admin (scope
# para Pablo via whitelist SSM). Requiere access JWT en todas las
# operations (salvo profile.confirm-email-change, que se autentica por el
# magic-link). NO usa Turnstile (ya autenticado). Sigue el patron
# lambda-controller con operation+action + http_handler.
#
# devtools traduce este manifiesto a llamadas AWS CLI directas:
#   python devtools/run.py serverless deploy --lambda=users

# --- Identidad ---
name: users
description: HTTP endpoint POST /users (profile/status/admin).

# --- Runtime ---
runtime: python3.13
handler: core.handler.lambda_handler
memory: 1024      # MB — PISO del proyecto (.claude/rules/lambda-config.md):
                  # TODOS los lambdas declaran 1024 como minimo (memoria==CPU,
                  # decision 2026-06-10). Subir por encima requiere medicion
                  # documentada; bajar esta prohibido.
timeout: 60       # segundos — colchon uniforme.

# SnapStart DESACTIVADO (2026-06): el storage del snapshot
# (Lambda-SnapStart-Cached-GB-S) se factura por hora por cada version
# publicada y NO entra en el free tier (~$50/mes con 25 funciones). El
# cold start lo mitiga la carga lazy de shared.auth. Re-evaluar solo si
# lo exige. Ver .claude/rules/lambda-config.md.
snap_start: false

# --- Como se invoca este Lambda ---
trigger:
  type: http
  method: POST
  path: /users

# --- Que recursos del backend usa ---
uses:
  # Lambdas que invoca async (InvocationType='Event', fire-and-forget).
  # devtools concede lambda:InvokeFunction al rol IAM e inyecta
  # LAMBDA_SEND_EMAIL_FUNCTION_NAME al runtime. Reemplaza la cola SQS: las
  # notificaciones (email-change-verify, email-changed, account-disabled,
  # account-deleted) se delegan a send_email. NUNCA invoca SES directo.
  invokes:
    - send_email
  # Tablas DynamoDB: cache (shared.rate_limit usa @cached para las rules)
  # + rate-limit per-IP + jwt-blacklist (revoke-session / force-logout /
  # delete-account blacklistean families).
  tables:
    cache: read-write
    rate-limit-rules: read-write
    rate-limit-buckets: read-write
    jwt-blacklist: read-write
  # Secretos que el Lambda lee de SSM (solo el nombre corto).
  secrets:
    - neon-url            # connection string Neon (auth_* + gestion)
    - jwt-secret          # verifica el access JWT (HS256)
    - admin-emails        # whitelist del scope admin.*
  # El Lambda NO envia email directo: invoca send_email async (que hace SES).
  sends-email: false

# --- Variables de entorno por entorno ---
env:
  default:
    LOG_LEVEL: INFO
    POWERTOOLS_SERVICE_NAME: users
    POWERTOOLS_METRICS_NAMESPACE: Portfolio/Users
    JWT_ISSUER: portfolio-auth
    JWT_AUDIENCE: portfolio
  dev:
    LOG_LEVEL: INFO
    CORS_ALLOWED_ORIGINS: 'https://portfolio.dev.the-full-stack.com,https://hub.portfolio.dev.the-full-stack.com,https://fintech.portfolio.dev.the-full-stack.com,https://architect.portfolio.dev.the-full-stack.com,https://leader.portfolio.dev.the-full-stack.com,https://vibe.portfolio.dev.the-full-stack.com,https://admin.portfolio.dev.the-full-stack.com,http://localhost:9970'
    USERS_BASE_URL: https://api.portfolio.dev.the-full-stack.com/users
  prod:
    LOG_LEVEL: WARNING
    CORS_ALLOWED_ORIGINS: 'https://the-full-stack.com,https://www.the-full-stack.com,https://portfolio.the-full-stack.com,https://hub.portfolio.the-full-stack.com,https://fintech.portfolio.the-full-stack.com,https://architect.portfolio.the-full-stack.com,https://leader.portfolio.the-full-stack.com,https://vibe.portfolio.the-full-stack.com,https://admin.portfolio.the-full-stack.com'
    USERS_BASE_URL: https://api.portfolio.the-full-stack.com/users
