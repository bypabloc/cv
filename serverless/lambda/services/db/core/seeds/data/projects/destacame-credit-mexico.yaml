caseStudyDetailed:
  problem:
    es: >-
      Mercado mexicano requeria creditos personales accesibles con onboarding rapido. Restricciones
      regulatorias locales + fricciones de KYC + integracion con bureaus de credito.
    en: >-
      Mexican market required accessible personal credit with fast onboarding. Local regulatory
      constraints + KYC friction + credit bureau integrations.
  process:
    es: >-
      Producto con tramos de credito + scoring embebido + flujo de aprobacion de baja friccion.
      Frontend Vue/Nuxt + microservicios Django + integraciones con bureaus mexicanos. Decisiones de
      arquitectura documentadas para sucesores.
    en: >-
      Tiered-credit product + embedded scoring + low-friction approval flow. Vue/Nuxt frontend +
      Django microservices + Mexican credit bureau integrations. Documented architecture decisions
      for successors.
  result:
    es: >-
      Contribucion clave al portafolio fintech LATAM de Destacame en el mercado mexicano.
      Reutilizacion de patrones del producto Chile con adaptacion regulatoria local (metricas bajo
      NDA).
    en: >-
      Key contribution to Destacame LATAM fintech portfolio in the Mexican market. Pattern reuse
      from the Chilean product with local regulatory adaptation (metrics under NDA).
